  psalmody.proph-t-pr-dicav-runt-nasci-salvat-rem-de-v-rgin-308c170424:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          The Prophets foretold * that the Saviour should be born of the Virgin Mary.
          The Spirit of the Lord * is upon me, because he hath anointed me to preach the Gospel to the poor.
          For Zion's sake * will I not hold my peace, until her Righteous One goeth forth as brightness.
          Behold, the Lord cometh, * to sit among princes, and to inherit the throne of glory.
          Tell it out among the people, * and say: Behold, God, our Saviour cometh.
      la:
      - type: text
        text: |-
          Prophétæ prædicavérunt * nasci Salvatórem de Vírgine María.
          Spíritus * Dómini super me, evangelizáre paupéribus misit me.
          Propter Sion * non tacébo, donec egrediátur ut splendor iustus eius.
          Ecce, véniet Dóminus, * ut sédeat cum princípibus, et sólium glóriæ téneat.
          Annuntiáte * pópulis, et dícite: Ecce, Deus Salvátor noster véniet.
      en:
      - type: text
        text: |-
          The prophets foretold * that the Savior would be born of the Virgin Mary.
          The Spirit * of the Lord is upon me; he has sent me to proclaim good news to the poor.
          For Sion's sake * I will not be silent, until her just one goes forth as brightness.
          Behold, the Lord will come, * to sit with princes and hold the throne of glory.
