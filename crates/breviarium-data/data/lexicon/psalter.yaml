  psalmody.tibi-soli-pecc-vi-d-mine-miser-re-mei-64496ca728:
    role: psalmody
    content:
      en-dr:
      - type: psalmody
        antiphon: Before thee only have I sinned, * O Lord, have mercy on me.
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: Turn thee again, O Lord, * and be gracious unto thy servants.
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: O God, * thou hast multiplied thy mercy.
        psalms:
        - number: '35'
      - type: psalmody
        antiphon: The Lord is my strength * and my praise, and he is become my salvation.
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: Praise the Lord * who healeth the broken of heart, and bindeth up their wounds.
        psalms:
        - number: '146'
      la:
      - type: psalmody
        antiphon: Tibi soli peccávi, * Dómine, miserére mei.
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: Convértere, Dómine, * et deprecábilis esto super servos tuos.
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: Multiplicásti, Deus, * misericórdiam tuam.
        psalms:
        - number: '35'
      - type: psalmody
        antiphon: 'Fortitúdo mea * et laus mea Dóminus: et factus est mihi in salútem.'
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: Laudáte * Dóminum qui sanat contrítos corde, et álligat contritiónes eórum.
        psalms:
        - number: '146'
      en:
      - type: psalmody
        antiphon: Against you alone have I sinned, * O Lord, have mercy on me.
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: Turn, O Lord, * and be appeased toward your servants.
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: You have multiplied, O God, * your mercy.
        psalms:
        - number: '35'
      - type: psalmody
        antiphon: 'The Lord is my strength * and my praise: and he has become my salvation.'
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: Praise * the Lord, who heals the brokenhearted, and binds up their wounds.
        psalms:
        - number: '146'
      zhs-ecu:
      - type: psalmody
        antiphon: 主啊，我惟独得罪了你； * 求你怜悯我。
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: 主啊，求你回转， * 转意怜恤你的仆人。
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: 神啊，你的慈爱 * 何其宝贵。
        psalms:
        - number: '35'
      - type: psalmody
        antiphon: 主是我的力量， * 是我的诗歌，他也成了我的拯救。
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: 你们要赞美主， * 他医好伤心的人，裹好他们的伤处。
        psalms:
        - number: '146'
      zhs:
      - type: psalmody
        antiphon: 惟独对祢，我得了罪，* 上主，求祢怜悯我。
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: 上主，求祢归来，* 求祢怜恤祢的仆役。
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: 天主，祢的仁爱 * 浩大无边。
        psalms:
        - number: '35'
      - type: psalmody
        antiphon: 上主是我的力量 * 与勇敢：祂始终作了我的救援。
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: 请赞美 * 上主，祂医治了心灵破碎的人，并亲自包扎了他们的伤痕。
        psalms:
        - number: '146'
  psalmody.tibi-soli-pecc-vi-d-mine-miser-re-mei-98ee56fcaf:
    role: psalmody
    content:
      en-dr:
      - type: psalmody
        antiphon: Against thee only have I sinned; * O Lord, have mercy upon me.
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: O Lord, * you have become our refuge.
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: In the morning * I shall meditate upon thee.
        psalms:
        - number: '62'
        - number: '66'
      - type: psalmody
        antiphon: Let us sing * to the Lord of glory.
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: Praise ye the Lord * in his holy places.
        psalms:
        - number: '148'
        - number: '149'
        - number: '150'
      la:
      - type: psalmody
        antiphon: Tibi soli peccávi, * Dómine, miserére mei.
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: Dómine, * refúgium factus es nobis.
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: In matutínis * meditábor in te.
        psalms:
        - number: '62'
        - number: '66'
      - type: psalmody
        antiphon: Cantémus Dómino * glorióse.
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: In sanctis eius * laudáte Deum.
        psalms:
        - number: '148'
        - number: '149'
        - number: '150'
      en:
      - type: psalmody
        antiphon: Against you alone have I sinned, * O Lord, have mercy on me.
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: O Lord, * you have been made our refuge.
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: In the morning * I will meditate on you.
        psalms:
        - number: '62'
        - number: '66'
      - type: psalmody
        antiphon: Let us sing to the Lord * gloriously.
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: Praise God * among his holy ones.
        psalms:
        - number: '148'
        - number: '149'
        - number: '150'
      zhs-ecu:
      - type: psalmody
        antiphon: 主啊，我惟独得罪了你； * 求你怜悯我。
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: 主啊， * 你世世代代作我们的居所。
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: 在清晨 * 我要思想你。
        psalms:
        - number: '62'
        - number: '66'
      - type: psalmody
        antiphon: 我们要向主歌唱， * 因他大大得胜。
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: 你们要在他的圣所 * 赞美神。
        psalms:
        - number: '148'
        - number: '149'
        - number: '150'
      zhs:
      - type: psalmody
        antiphon: 惟独对祢，我得了罪，* 上主，求祢怜悯我。
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: 吾主，* 祢成了我们的靠山。
        psalms:
        - number: '89'
      - type: psalmody
        antiphon: 在晨晓时分，* 我要默想祢。
        psalms:
        - number: '62'
        - number: '66'
      - type: psalmody
        antiphon: 我们要歌颂上主，* 光荣地颂扬祂。
        psalms:
        - number: '224'
      - type: psalmody
        antiphon: 在祂的圣所中，* 请赞美天主。
        psalms:
        - number: '148'
        - number: '149'
        - number: '150'
  psalmody.ut-non-del-nquam-in-lingua-mea-db54149161:
    role: psalmody
    content:
      en-dr:
      - type: psalmody
        antiphon: That I sin not * with my tongue.
        psalms:
        - number: '38'
        - number: '39'
      - type: psalmody
        antiphon: Heal * my soul, O Lord, for I have sinned against Thee.
        psalms:
        - number: '40'
        - number: '41'
      - type: psalmody
        antiphon: Mine heart * is overflowing with a good matter.
        psalms:
        - number: '43'
        - number: '44'
      - type: psalmody
        antiphon: Our help * in trouble.
        psalms:
        - number: '45'
        - number: '46'
      - type: psalmody
        antiphon: Great is the Lord * and greatly to be praised.
        psalms:
        - number: '47'
        - number: '48'
      - type: psalmody
        antiphon: The God of gods * even the Lord, hath spoken.
        psalms:
        - number: '49'
        - number: '51'
      - type: versicle
        text: Offer unto God the sacrifice of praise.
      - type: response
        text: And pay thy vows unto the Most High.
      la:
      - type: psalmody
        antiphon: Ut non delínquam * in lingua mea.
        psalms:
        - number: '38'
        - number: '39'
      - type: psalmody
        antiphon: Sana * Dómine ánimam meam, qui peccávi tibi.
        psalms:
        - number: '40'
        - number: '41'
      - type: psalmody
        antiphon: Eructávit * cor meum verbum bonum.
        psalms:
        - number: '43'
        - number: '44'
      - type: psalmody
        antiphon: Adiútor * in tribulatiónibus.
        psalms:
        - number: '45'
        - number: '46'
      - type: psalmody
        antiphon: Magnus Dóminus * et laudábilis nimis.
        psalms:
        - number: '47'
        - number: '48'
      - type: psalmody
        antiphon: Deus deórum * Dóminus locútus est.
        psalms:
        - number: '49'
        - number: '51'
      - type: versicle
        text: Ímmola Deo sacrifium laudis.
      - type: response
        text: Et redde altíssimo vota tua.
      en:
      - type: psalmody
        antiphon: That I may not offend * with my tongue.
        psalms:
        - number: '38'
        - number: '39'
      - type: psalmody
        antiphon: Heal, * O Lord, my soul, for I have sinned against you.
        psalms:
        - number: '40'
        - number: '41'
      - type: psalmody
        antiphon: My heart * has uttered a good word.
        psalms:
        - number: '43'
        - number: '44'
      - type: psalmody
        antiphon: A helper * in tribulations.
        psalms:
        - number: '45'
        - number: '46'
      - type: psalmody
        antiphon: Great is the Lord * and exceedingly worthy of praise.
        psalms:
        - number: '47'
        - number: '48'
      - type: psalmody
        antiphon: The Lord, the God of gods, * has spoken.
        psalms:
        - number: '49'
        - number: '51'
      - type: versicle
        text: Offer to God a sacrifice of praise.
      - type: response
        text: And pay your vows to the Most High.
      zhs-ecu:
      - type: psalmody
        antiphon: 我要谨慎我的言行 * 免得我舌头犯罪。
        psalms:
        - number: '38'
        - number: '39'
      - type: psalmody
        antiphon: 主啊，求你医治 * 我的灵魂，因为我得罪了你。
        psalms:
        - number: '40'
        - number: '41'
      - type: psalmody
        antiphon: 我心里涌出 * 美辞。
        psalms:
        - number: '43'
        - number: '44'
      - type: psalmody
        antiphon: 在患难中 * 随时的帮助。
        psalms:
        - number: '45'
        - number: '46'
      - type: psalmody
        antiphon: 主本为大， * 该受大赞美。
        psalms:
        - number: '47'
        - number: '48'
      - type: psalmody
        antiphon: 大能者神， * 主已经发言。
        psalms:
        - number: '49'
        - number: '51'
      - type: versicle
        text: 你们要以感谢为祭献给神。
      - type: response
        text: 又要向至高者还你的愿。
      zhs:
      - type: psalmody
        antiphon: 使我不以口舌 * 犯罪。
        psalms:
        - number: '38'
        - number: '39'
      - type: psalmody
        antiphon: 求祢治愈 * 上主，我的灵魂，因为我得罪了祢。
        psalms:
        - number: '40'
        - number: '41'
      - type: psalmody
        antiphon: 我的心灵涌溢 * 美善的言辞。
        psalms:
        - number: '43'
        - number: '44'
      - type: psalmody
        antiphon: 患难中的 * 助佑者。
        psalms:
        - number: '45'
        - number: '46'
      - type: psalmody
        antiphon: 上主至大，* 应受到极度赞颂。
        psalms:
        - number: '47'
        - number: '48'
      - type: psalmody
        antiphon: 众神之天主，* 上主已出令传召。
        psalms:
        - number: '49'
        - number: '51'
      - type: versicle
        text: 向天主奉献颂谢祭。
      - type: response
        text: 并向至高者偿还你的许愿。
  psalmody.v-niet-ecce-rex-exc-lsus-cum-potest-te-magna-ad-170ce41e3d:
    role: psalmody
    content:
      en-dr:
      - type: psalmody
        antiphon: Behold, there cometh the King * even the Most High, with great power, to save the nations, alleluia.
        psalms:
        - number: '1'
      - type: psalmody
        antiphon: 'Strengthen ye * the weak hands, be strong, say: Behold, our God will come, and save us, alleluia.'
        psalms:
        - number: '2'
      - type: psalmody
        antiphon: Rejoice * all ye, and be glad for, behold, the Lord will come with vengeance, He will bring a recompense He will come and save us.
        psalms:
        - number: '3'
      - type: versicle
        text: Out of Zion, the Perfection of beauty.
      - type: response
        text: Our God shall come manifestly.
      - type: psalmody
        antiphon: Rejoice greatly, * O daughter of Jerusalem; behold, thy King cometh into thee, O Zion; fear not, for thy salvation cometh quickly.
        psalms:
        - number: '8'
      - type: psalmody
        antiphon: 'Christ our King cometh, * Whom John preached, saying: Behold the Lamb That should come!'
        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: Behold, I come * quickly, saith the Lord, and My reward is with Me, to give every man according as his work shall be.
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: Send forth the Lamb, O Lord, the ruler of the land.
      - type: response
        text: From the Rock of the wilderness unto the mount of the daughter of Zion.
      - type: psalmody
        antiphon: 'The Angel Gabriel * spake unto Mary, saying: Hail, thou that art full of grace, the Lord is with thee: blessed art thou among women.'
        psalms:
        - number: '9'
          start: '22'
          end: '32'
      - type: psalmody
        antiphon: 'Mary said: * What manner of salutation is this? My soul is troubled. Shall I bear the King? And will He not break the seal of my virginity?'
        psalms:
        - number: '9'
          start: '33'
          end: '39'
      - type: psalmody
        antiphon: The King, * even the Most High, cometh therefore let the hearts of men be purified to go forth to meet Him, for, behold, He will come and will not tarry.
        psalms:
        - number: '10'
      - type: versicle
        text: The Lord cometh out of His holy place.
      - type: response
        text: He will come and save His people.
      la:
      - type: psalmody
        antiphon: Véniet ecce Rex * excélsus cum potestáte magna ad salvándas gentes, allelúia.
        psalms:
        - number: '1'
      - type: psalmody
        antiphon: 'Confortáte * manus dissolútas: confortámini, dícite: Ecce Deus noster véniet, et salvábit nos, allelúia.'
        psalms:
        - number: '2'
      - type: psalmody
        antiphon: 'Gaudéte omnes * et lætámini: ecce quia véniet Dóminus ultiónis addúcet retributiónem: ipse véniet, et salvábit nos.'
        psalms:
        - number: '3'
      - type: versicle
        text: Ex Sion spécies decóris eius.
      - type: response
        text: Deus noster maniféste véniet.
      - type: psalmody
        antiphon: 'Gaude et lætáre, * fília Ierúsalem: ecce Rex tuus véniet tibi: Sion, noli timére, quia cito véniet salus tua.'
        psalms:
        - number: '8'
      - type: psalmody
        antiphon: Rex noster * advéniet Christus, quem Ioánnes prædicávit Agnum esse ventúrum.
        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: 'Ecce vénio * cito et merces mea mecum est, dicit Dóminus: dare unicuíque secúndum ópera sua.'
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: Emítte Agnum, Dómine, Dominatórem terræ.
      - type: response
        text: De Petra desérti ad montem fíliæ Sion.
      - type: psalmody
        antiphon: 'Gábriel Ángelus * locútus est Maríæ, dicens: Ave, grátia plena: Dóminus tecum: benedícta tu inter mulíeres.'
        psalms:
        - number: '9'
          start: '22'
          end: '32'
      - type: psalmody
        antiphon: 'María dixit: * Putas qualis est ista salutátio, quia conturbáta est ánima mea, et quia paritúra sum Regem, qui claustrum virginitátis meæ non violábit?'
        psalms:
        - number: '9'
          start: '33'
          end: '39'
      - type: psalmody
        antiphon: 'In advéntu * summi Regis mundéntur corda hóminum, ut digne ambulémus in occúrsum illíus: quia ecce véniet et non tardábit.'
        psalms:
        - number: '10'
      - type: versicle
        text: Egrediétur Dóminus de loco sancto suo.
      - type: response
        text: Véniet ut salvet pópulum suum.
      en:
      - type: psalmody
        antiphon: Behold, the King most high * shall come with great power to save the nations, alleluia.
        psalms:
        - number: '1'
      - type: psalmody
        antiphon: 'Strengthen * the drooping hands: take courage, say: Behold, our God shall come, and will save us, alleluia.'
        psalms:
        - number: '2'
      - type: psalmody
        antiphon: 'Rejoice, all, * and be glad: behold, for the Lord of vengeance shall come, he shall bring retribution: he himself shall come, and will save us.'
        psalms:
        - number: '3'
      - type: versicle
        text: Out of Sion, the perfection of his beauty.
      - type: response
        text: Our God shall come manifestly.
      - type: psalmody
        antiphon: 'Rejoice and be glad, * O daughter of Jerusalem: behold, your King shall come to you: O Sion, fear not, for your salvation shall come quickly.'
        psalms:
        - number: '8'
      - type: psalmody
        antiphon: Our King * Christ shall come, whom John proclaimed to be the Lamb who was to come.
        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: 'Behold, I come * quickly and my reward is with me, says the Lord: to give to each one according to his works.'
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: Send forth the Lamb, O Lord, the Ruler of the earth.
      - type: response
        text: From the Rock of the desert to the mount of the daughter of Sion.
      - type: psalmody
        antiphon: 'The Angel Gabriel * spoke to Mary, saying: Hail, full of grace: the Lord is with you: blessed are you among women.'
        psalms:
        - number: '9'
          start: '22'
          end: '32'
      - type: psalmody
        antiphon: 'Mary said: * I wonder what manner of greeting this is, for my soul is troubled, and because I shall bring forth a King who shall not violate the enclosure of my virginity?'
        psalms:
        - number: '9'
          start: '33'
          end: '39'
      - type: psalmody
        antiphon: 'In the advent * of the most high King, let the hearts of men be cleansed, that we may walk worthily to meet him: for behold, he shall come and shall not delay.'
        psalms:
        - number: '10'
      - type: versicle
        text: The Lord shall go forth from his holy place.
      - type: response
        text: He shall come to save his people.
      zhs-ecu:
      - type: psalmody
        antiphon: 看哪，那至高的君王 * 必大有权能而来，为要拯救万民，阿肋路亚。
        psalms:
        - number: '1'
      - type: psalmody
        antiphon: 要使 * 软弱的手坚壮，你们当刚强，说：看哪，我们的神必来，他必拯救我们，阿肋路亚。
        psalms:
        - number: '2'
      - type: psalmody
        antiphon: 你们众人都要欢喜 * 快乐：看哪，那施行报应的主必来，必施行报偿；他必亲自来拯救我们。
        psalms:
        - number: '3'
      - type: versicle
        text: 从锡安发出他全美的荣光。
      - type: response
        text: 我们的神必显然而来。
      - type: psalmody
        antiphon: 耶路撒冷的女子啊， * 你要欢喜快乐：看哪，你的君王必到你这里来；锡安哪，不要惧怕，因为你的救恩快要来到。
        psalms:
        - number: '8'
      - type: psalmody
        antiphon: 我们的君王基督 * 必要降临，就是约翰所宣告将要来的羔羊。
        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: 主说：看哪，我必快来， * 赏罚在我，要照各人所行的报应他。
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: 主啊，求你差遣那地的统治者羔羊。
      - type: response
        text: 从旷野的磐石到锡安女子的山上。
      - type: psalmody
        antiphon: 天使加百列 * 对马利亚说：万福，蒙大恩的女子，主和你同在，你在妇女中是有福的。
        psalms:
        - number: '9'
          start: '22'
          end: '32'
      - type: psalmody
        antiphon: 马利亚说： * 这是怎样的问安，竟使我的心惊慌？因我将要生下君王，他却不损坏我童贞的封闭。
        psalms:
        - number: '9'
          start: '33'
          end: '39'
      - type: psalmody
        antiphon: 在至高君王降临之际， * 愿人心得以洁净，使我们配得迎接他：因为看哪，他必来，绝不迟延。
        psalms:
        - number: '10'
      - type: versicle
        text: 主必从他的圣所出来。
      - type: response
        text: 他要来拯救他的子民。
      zhs:
      - type: psalmody
        antiphon: 看哪，崇高的君王 * 将以大能来拯救万民，阿肋路亚。
        psalms:
        - number: '1'
      - type: psalmody
        antiphon: 加强 * 痿弱的手：振作起来，说：看，我们的天主要来，祂要拯救我们，阿肋路亚。
        psalms:
        - number: '2'
      - type: psalmody
        antiphon: 众人欢乐 * 踊跃喜欢：看，上主要来，报复已到，祂要带来报酬；祂亲自要来，要拯救我们。
        psalms:
        - number: '3'
      - type: versicle
        text: 天主由美丽绝伦的熙雍，发出光明。
      - type: response
        text: 我们的天主来临，绝不会默默无声。
      - type: psalmody
        antiphon: 欢乐踊跃吧， * 耶路撒冷女儿：看，你的君王要来到你这里；熙雍，不要畏惧，因为你的救恩快要来临。
        psalms:
        - number: '8'
      - type: psalmody
        antiphon: 我们的君王 * 基督要来，若翰曾宣告祂是将要来临的羔羊。
        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: 看，我快要来， * 我随身带着报酬，上主说：要按照各人的行为还报各人。
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: 上主，请遣派那主宰大地的羔羊。
      - type: response
        text: 从旷野的磐石，至熙雍女儿的山岭。
      - type: psalmody
        antiphon: 天使加俾额尔 * 向玛利亚说：万福，充满恩宠者：上主与你同在：在女人中你是蒙祝福的。
        psalms:
        - number: '9'
          start: '22'
          end: '32'
      - type: psalmody
        antiphon: 玛利亚说： * 这样的请安有什么意思呢？我的心灵惊惶不安，因为我将要生下一位君王，祂不会破坏我童贞之封印。
        psalms:
        - number: '9'
          start: '33'
          end: '39'
      - type: psalmody
        antiphon: 在至高君王 * 降临之际，愿人心洁净，使我们能庄严地前去迎接祂；因为看，祂要来，决不迟延。
        psalms:
        - number: '10'
      - type: versicle
        text: 上主将从他的圣所出来。
      - type: response
        text: 他将来拯救他的人民。
