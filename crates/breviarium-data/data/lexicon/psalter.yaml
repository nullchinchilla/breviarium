        psalms:
        - number: '2'
      - type: psalmody
        antiphon: Arise, * O Lord; save me, O my God.
        psalms:
        - number: '3'
      - type: versicle
        text: In the night I have remembered thy name, O Lord.
      - type: response
        text: And have kept thy law.
      - type: psalmody
        antiphon: How admirable * is thy name, O Lord, in the whole earth!
        psalms:
        - number: '8'
      - type: psalmody
