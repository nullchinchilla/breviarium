        - number: '49'
          start: '1'
          end: '15'
      - type: psalmody
        antiphon: Understand, * you who forget God.
        psalms:
        - number: '49'
          start: '16'
          end: '23'
      - type: psalmody
        antiphon: You will accept a sacrifice * of justice upon your altar, O Lord.
        psalms:
        - number: '50'
      - type: versicle
        text: You will give to my hearing joy and gladness.
      - type: response
        text: And the humbled bones will rejoice.
      zhs-ecu:
      - type: psalmody
        antiphon: 你比世人 * 更美，恩惠浇灌在你的嘴唇上。
        psalms:
        - number: '44'
          start: 2a
          end: 10b
      - type: psalmody
        antiphon: 神啊，万民要称谢你， * 直到永远。
        psalms:
        - number: '44'
          start: '11'
          end: 18b
      - type: psalmody
        antiphon: 神是我们在患难中 * 随时的帮助。
        psalms:
        - number: '45'
      - type: versicle
        text: 万军之主与我们同在。
      - type: response
        text: 雅各的神是我们的避难所。
      - type: psalmody
        antiphon: 主本为大， * 在我们神的城中，该受大赞美。
        psalms:
        - number: '47'
      - type: psalmody
        antiphon: 我口要说 * 智慧的言语，我心要想通达的道理。
        psalms:
        - number: '48'
          start: '2'
          end: '13'
      - type: psalmody
        antiphon: 不要惧怕， * 人发财的时候，他的荣耀必不随他下到坟墓。
        psalms:
        - number: '48'
          start: '14'
          end: '21'
      - type: versicle
        text: 神必救赎我的灵魂脱离阴间的权势。
      - type: response
        text: 因他必收纳我。
      - type: psalmody
        antiphon: 大能者神， * 主已经发言。
        psalms:
        - number: '49'
          start: '1'
          end: '15'
      - type: psalmody
        antiphon: 你们忘记神的人哪， * 要思想这事。
        psalms:
        - number: '49'
          start: '16'
          end: '23'
      - type: psalmody
        antiphon: 主啊，那时你必喜爱 * 你坛上的公义的祭。
        psalms:
        - number: '50'
      - type: versicle
        text: 求你使我得听欢喜快乐的声音。
      - type: response
        text: 使你所压伤的骨头可以踊跃。
      zhs:
      - type: psalmody
        antiphon: 你在世人中最为美丽，* 你口唇中流露着慈惠。
        psalms:
        - number: '44'
          start: 2a
          end: 10b
      - type: psalmody
        antiphon: 愿万民都称颂你，* 天主，直到永远。
        psalms:
        - number: '44'
          start: '11'
          end: 18b
      - type: psalmody
        antiphon: 是患难中最易寻到的保障，* 我们的天主。
        psalms:
        - number: '45'
      - type: versicle
        text: 万军的上主与我们同在。
      - type: response
        text: 雅各伯的天主是我们的保护。
      - type: psalmody
        antiphon: 上主至大，* 在我们天主的城池中，应受到赞颂。
        psalms:
        - number: '47'
      - type: psalmody
        antiphon: 我的口要宣讲智慧，* 我的心要思念哲理。
        psalms:
        - number: '48'
          start: '2'
          end: '13'
      - type: psalmody
        antiphon: 不要嫉妒，* 富人死时，荣华不随他入坟墓。
        psalms:
        - number: '48'
          start: '14'
          end: '21'
      - type: versicle
        text: 天主必救我灵脱离阴府，
      - type: response
        text: 因为他要把我接走。
      - type: psalmody
        antiphon: 万神之神，* 上主发出了号令。
        psalms:
        - number: '49'
          start: '1'
          end: '15'
      - type: psalmody
        antiphon: 你们要彻底觉悟，* 忘记天主的人们！
        psalms:
        - number: '49'
          start: '16'
          end: '23'
      - type: psalmody
        antiphon: 那时，你必悦纳合法之祭，* 牺牲和全燔祭献，上主。
        psalms:
        - number: '50'
      - type: versicle
        text: 求你赐我听见快慰和喜乐，
      - type: response
        text: 使你粉碎的骨骸重新欢跃。
  psalmody.surr-xit-d-minus-de-sep-lcro-allel-ia-e0e7274ff8:
    role: psalmody
    content:
      en-dr:
      - type: response
        text: The Lord is risen from the sepulchre, alleluia.
      - type: versicle
        text: Who for us was hanged on the tree, alleluia.
      la:
      - type: versicle
        text: Surréxit Dóminus de sepúlcro, allelúia.
      - type: response
        text: Qui pro nobis pepéndit in ligno, allelúia.
      en:
      - type: versicle
        text: The Lord has risen from the tomb, alleluia.
      - type: response
        text: Who for us hung upon the wood, alleluia.
      zhs-ecu:
      - type: versicle
        text: 主从坟墓中复活了，阿肋路亚。
      - type: response
        text: 就是那为我们悬挂在木头上的主，阿肋路亚。
      zhs:
      - type: versicle
        text: 上主从坟墓中复活了，阿肋路亚。
      - type: response
        text: 祂为我们被钉在十字架上，阿肋路亚。
  psalmody.surr-xit-d-minus-vere-allel-ia-aa318f6898:
    role: psalmody
    content:
      en-dr:
      - type: response
        text: The Lord is risen indeed, alleluia.
      - type: versicle
        text: And hath appeared to Simon, alleluia.
      la:
      - type: versicle
        text: Surréxit Dóminus vere, allelúia.
      - type: response
        text: Et appáruit Simóni, allelúia.
      en:
      - type: versicle
        text: The Lord is truly risen, alleluia.
      - type: response
        text: And he appeared to Simon, alleluia.
      zhs-ecu:
      - type: versicle
        text: 主真的复活了，阿肋路亚。
      - type: response
        text: 他向西门显现了，阿肋路亚。
      zhs:
      - type: versicle
        text: 主确实复活了，阿肋路亚。
      - type: response
        text: 祂显现给西满，阿肋路亚。
  psalmody.suscit-vit-d-minus-testim-nium-in-iacob-et-legem-241e32d100:
    role: psalmody
    content:
      en-dr:
      - type: psalmody
        antiphon: 'The Lord set up a testimony in Jacob: * and made a law in Israel.'
        psalms:
        - number: '77'
          start: '1'
          end: '8'
      - type: psalmody
        antiphon: The Lord did wonderful things * in the sight of their fathers.
        psalms:
        - number: '77'
          start: '9'
          end: '16'
      - type: psalmody
        antiphon: The Lord opened * the doors of heaven and had rained down manna upon them to eat.
        psalms:
        - number: '77'
          start: '17'
          end: '31'
      - type: versicle
        text: He struck the rock, and the waters gushed out.
      - type: response
        text: And the streams overflowed.
      - type: psalmody
        antiphon: God is their helper, * and the most high God their redeemer.
        psalms:
        - number: '77'
          start: '32'
          end: '41'
      - type: psalmody
        antiphon: The Lord redeemed them * from the hand of him that afflicted them.
        psalms:
        - number: '77'
          start: '42'
          end: '58'
      - type: psalmody
        antiphon: God built * his sanctuary in the earth.
        psalms:
        - number: '77'
          start: '59'
          end: '72'
      - type: versicle
        text: The Lord chose the tribe of Juda.
      - type: response
        text: Mount Sion which he loved.
      - type: psalmody
        antiphon: 'Help us, O God, our Saviour, * deliver us: and forgive us our sins.'
        psalms:
        - number: '78'
      - type: psalmody
        antiphon: I am the Lord * God of Israel, who brought you out from the land of Egypt.
        psalms:
        - number: '80'
      - type: psalmody
        antiphon: Be not thou silent, O Lord, * for Thy enemies lifted up their head.
        psalms:
        - number: '82'
      - type: versicle
        text: Let them know that the Lord is thy name.
      - type: response
        text: Thou alone art the most High over all the earth.
      la:
      - type: psalmody
        antiphon: 'Suscitávit Dóminus * testimónium in Iacob: et legem pósuit in Israël.'
        psalms:
        - number: '77'
          start: '1'
          end: '8'
      - type: psalmody
        antiphon: Coram pátribus eórum * fecit Deus mirabília.
        psalms:
        - number: '77'
          start: '9'
          end: '16'
      - type: psalmody
        antiphon: Iánuas cæli apéruit * Dóminus, et pluit illis manna ad manducándum.
        psalms:
        - number: '77'
          start: '17'
          end: '31'
      - type: versicle
        text: Deus percússit petram et fluxérunt aquæ.
      - type: response
        text: Et torréntes inundavérunt.
      - type: psalmody
        antiphon: 'Deus adiútor * est eórum: et Excélsus redémptor eórum est.'
        psalms:
        - number: '77'
          start: '32'
          end: '41'
      - type: psalmody
        antiphon: Redémit eos * Dóminus de manu tribulántis.
        psalms:
        - number: '77'
          start: '42'
          end: '58'
      - type: psalmody
        antiphon: Ædificávit * Deus sanctifícium suum in terra.
        psalms:
        - number: '77'
          start: '59'
          end: '72'
      - type: versicle
        text: Elégit Dóminus tribum Iuda.
      - type: response
        text: Montem Sion quem diléxit.
      - type: psalmody
        antiphon: 'Ádiuva nos, * Deus, salutáris noster: et propítius esto peccátis nostris.'
        psalms:
        - number: '78'
      - type: psalmody
        antiphon: Ego sum Dóminus * Deus tuus Israël, qui edúxi te de terra Ægýpti.
        psalms:
        - number: '80'
      - type: psalmody
        antiphon: Ne táceas Deus * quóniam inimíci tui extulérunt caput.
        psalms:
        - number: '82'
      - type: versicle
        text: Cognóscant quia nomen tibi Dóminus.
      - type: response
        text: Tu solus Altíssimus super omnem terram.
      en:
      - type: psalmody
        antiphon: 'The Lord raised up * a testimony in Jacob: and appointed a law in Israel.'
        psalms:
        - number: '77'
          start: '1'
          end: '8'
      - type: psalmody
        antiphon: Before their fathers * God worked wonders.
        psalms:
        - number: '77'
          start: '9'
          end: '16'
      - type: psalmody
        antiphon: The Lord opened * the gates of heaven, and rained down manna upon them to eat.
        psalms:
        - number: '77'
          start: '17'
          end: '31'
      - type: versicle
        text: God struck the rock and waters flowed.
      - type: response
        text: And the torrents overflowed.
      - type: psalmody
        antiphon: 'God * is their helper: and the Most High is their redeemer.'
        psalms:
        - number: '77'
          start: '32'
          end: '41'
      - type: psalmody
        antiphon: The Lord * redeemed them from the hand of the one who afflicted them.
        psalms:
        - number: '77'
          start: '42'
          end: '58'
      - type: psalmody
        antiphon: God * built his sanctuary on earth.
        psalms:
        - number: '77'
          start: '59'
          end: '72'
      - type: versicle
        text: The Lord chose the tribe of Judah.
      - type: response
        text: Mount Sion, which he loved.
      - type: psalmody
        antiphon: 'Help us, * O God, our salvation: and be gracious toward our sins.'
        psalms:
        - number: '78'
      - type: psalmody
        antiphon: I am the Lord * your God, O Israel, who brought you out of the land of Egypt.
        psalms:
        - number: '80'
      - type: psalmody
        antiphon: Be not silent, O God, * for your enemies have lifted up their head.
        psalms:
        - number: '82'
      - type: versicle
        text: Let them know that your name is Lord.
      - type: response
        text: You alone are the Most High over all the earth.
      zhs-ecu:
      - type: psalmody
        antiphon: 主在雅各中立了 * 法度，在以色列中设立律法。
        psalms:
        - number: '77'
          start: '1'
          end: '8'
      - type: psalmody
        antiphon: 神在他们祖宗面前 * 行了奇事。
        psalms:
        - number: '77'
          start: '9'
          end: '16'
      - type: psalmody
        antiphon: 主敞开 * 天上的门，降吗哪给他们吃。
        psalms:
        - number: '77'
          start: '17'
          end: '31'
      - type: versicle
        text: 神击打磐石，水就涌出。
      - type: response
        text: 众河也都泛滥。
      - type: psalmody
        antiphon: 神是他们的 * 帮助，至高者是他们的救赎主。
        psalms:
        - number: '77'
          start: '32'
          end: '41'
      - type: psalmody
        antiphon: 主救赎他们 * 脱离欺压者的手。
        psalms:
        - number: '77'
          start: '42'
          end: '58'
      - type: psalmody
        antiphon: 神建造了 * 他的圣所在地上。
        psalms:
        - number: '77'
          start: '59'
          end: '72'
      - type: versicle
        text: 主拣选了犹大支派。
      - type: response
        text: 就是他所喜爱的锡安山。
      - type: psalmody
        antiphon: 拯救我们的神啊，求你帮助我们， * 求你赦免我们的罪。
        psalms:
        - number: '78'
      - type: psalmody
        antiphon: 我是主， * 你的神，以色列啊，是我领你从埃及地上来的。
        psalms:
        - number: '80'
      - type: psalmody
        antiphon: 神啊，求你不要静默， * 因为你的仇敌昂首。
        psalms:
        - number: '82'
      - type: versicle
        text: 使他们知道，惟独你名为主。
      - type: response
        text: 惟独你是统管全地的至高者。
      zhs:
      - type: psalmody
        antiphon: 上主在雅各伯颁布了诫命，* 也曾在以色列立定了法令；
        psalms:
        - number: '77'
          start: '1'
          end: '8'
      - type: psalmody
        antiphon: 在他们祖先面前，* 天主行了奇蹟。
        psalms:
        - number: '77'
          start: '9'
          end: '16'
      - type: psalmody
        antiphon: 祂开启了天上的门闸，* 上主降下玛纳供他们食用。
        psalms:
        - number: '77'
          start: '17'
          end: '31'
      - type: versicle
        text: 天主击打磐石，水便流出。
      - type: response
        text: 溪流也漫溢四方。
      - type: psalmody
        antiphon: 天主是他们的助佑，* 至高者天主是他们的救主。
        psalms:
        - number: '77'
          start: '32'
          end: '41'
      - type: psalmody
        antiphon: 上主救赎了他们，* 从压迫者手中救出他们。
        psalms:
        - number: '77'
          start: '42'
          end: '58'
      - type: psalmody
        antiphon: 天主建立了 * 祂在地上的圣所。
        psalms:
        - number: '77'
          start: '59'
          end: '72'
      - type: versicle
        text: 上主拣选了犹大支派。
      - type: response
        text: 就是祂所爱的熙雍圣山。
      - type: psalmody
        antiphon: 求祢协助我们，* 天主，我们的救主；求祢宽赦我们的罪过。
        psalms:
        - number: '78'
      - type: psalmody
        antiphon: 我是上主，* 我是你的天主，以色列，是我由埃及国将你领出。
        psalms:
        - number: '80'
      - type: psalmody
        antiphon: 天主，求祢不要缄默，* 因为你的仇敌摇头昂首。
        psalms:
        - number: '82'
      - type: versicle
        text: 使他们认识，祢的名号是雅威。
      - type: response
        text: 惟有祢在普天下至尊无对。
  psalmody.tamquam-sponsus-e520d0bd1c:
    role: psalmody
