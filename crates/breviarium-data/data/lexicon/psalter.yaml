        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: Arise, O Lord, * let not man prevail.
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: I rose at midnight to give praise to thee.
      - type: response
        text: For the judgments of thy justification.
      - type: psalmody
        antiphon: Why, O Lord, * hast thou retired afar off?
        psalms:
        - number: '9'
          start: '22'
          end: '32'
      - type: psalmody
        antiphon: Arise, O Lord God, * let thy hand be exalted.
        psalms:
        - number: '9'
          start: '33'
          end: '39'
      - type: psalmody
        antiphon: The Lord is just * and He hath loved justice.
        psalms:
        - number: '10'
      - type: versicle
        text: My eyes to thee have prevented the morning.
      - type: response
        text: That I might meditate on thy words, O Lord.
      la:
      - type: psalmody
        antiphon: Beátus vir * qui in lege Dómini meditátur.
        psalms:
        - number: '1'
      - type: psalmody
        antiphon: Servíte Dómino * in timóre, et exsultáte ei cum tremóre.
        psalms:
        - number: '2'
      - type: psalmody
        antiphon: Exsúrge, * Dómine, salvum me fac, Deus meus.
        psalms:
        - number: '3'
      - type: versicle
        text: Memor fui nocte nóminis tui, Dómine.
      - type: response
        text: Et custodívi legem tuam.
      - type: psalmody
        antiphon: Quam admirábile * est nomen tuum, Dómine, in univérsa terra!
        psalms:
        - number: '8'
      - type: psalmody
        antiphon: Sedísti super thronum * qui iúdicas iustítiam.
        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: Exsúrge, Dómine, * non præváleat homo.
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: Média nocte surgébam ad confiténdum tibi.
      - type: response
        text: Super iudícia iustificatiónis tuæ.
      - type: psalmody
        antiphon: Ut quid, Dómine, * recessísti longe?
        psalms:
        - number: '9'
          start: '22'
          end: '32'
      - type: psalmody
        antiphon: Exsúrge, * Dómine Deus, exaltétur manus tua.
        psalms:
        - number: '9'
          start: '33'
          end: '39'
      - type: psalmody
        antiphon: Iustus Dóminus * et iustítiam diléxit.
        psalms:
        - number: '10'
      - type: versicle
        text: Prævenérunt óculi mei ad te dilúculo.
      - type: response
        text: Ut meditárer elóquia tua, Dómine.
      en:
      - type: psalmody
        antiphon: Blessed is the man * who meditates on the law of the Lord.
