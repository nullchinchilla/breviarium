        psalms:
        - number: '20'
      - type: versicle
        text: 上主将从他的圣所出来。
      - type: response
        text: 他将来拯救他的人民。
  psalmody.v-niet-ecce-rex-exc-lsus-cum-potest-te-magna-ad-a24da87a49:
    role: psalmody
    content:
      en-dr:
      - type: psalmody
        antiphon: Behold, there cometh the King * even the Most High, with great power, to save the nations, alleluia.
        psalms:
        - number: '20'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '21'
      - type: psalmody
        antiphon: Strengthen ye * the weak hands be strong say Behold, our God will come, and save us, alleluja.
        psalms:
        - number: '22'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '23'
      - type: psalmody
        antiphon: Rejoice * all ye, and be glad for, behold, the Lord will come with vengeance, He will bring a recompense He will come and save us.
        psalms:
        - number: '24'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '25'
      - type: versicle
        text: Out of Zion, the Perfection of beauty.
      - type: response
        text: Our God shall come manifestly.
      - type: psalmody
        antiphon: Rejoice greatly * O daughter of Jerusalem behold, thy King cometh into thee, O Zion; fear not, for thy salvation cometh quickly.
        psalms:
        - number: '26'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '27'
      - type: psalmody
        antiphon: Christ our King cometh, * Whom John preached, saying Behold the Lamb That should come!
        psalms:
        - number: '28'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '29'
      - type: psalmody
        antiphon: Behold, I come * quickly, saith the Lord, and My reward is with Me, to give every man according as his work shall be
        psalms:
        - number: '30'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '31'
      - type: versicle
        text: Send forth the Lamb, O Lord, the ruler of the land.
      - type: response
        text: From the Rock of the wilderness unto the mount of the daughter of Zion.
      - type: psalmody
        antiphon: 'The Angel Gabriel spake unto Mary, saying: * Hail, thou that art full of grace, the Lord is with thee: blessed art thou among women.'
        psalms:
        - number: '240'
        - number: '241'
        - number: '242'
      - type: versicle
        text: The Lord cometh out of His holy place.
      - type: response
        text: He will come and save His people.
      la:
      - type: psalmody
        antiphon: Véniet ecce rex, * excélsus cum potestáte magna, ad salvándas gentes, allelúia.
        psalms:
        - number: '20'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '21'
      - type: psalmody
        antiphon: 'Confortáte * manus dissolútas: confortámini, dícite: Ecce Deus noster véniet, et salvábit nos, allelúia.'
        psalms:
        - number: '22'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '23'
      - type: psalmody
        antiphon: 'Gaudéte omnes * et lætámini: ecce, qui véniet Dóminus ultiónis, addúcet retributiónem: ipse véniet, et salvábit nos.'
        psalms:
        - number: '24'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '25'
      - type: versicle
        text: Ex Sion spécies decóris eius.
      - type: response
        text: Deus noster maniféste véniet.
      - type: psalmody
        antiphon: 'Gaude et lætáre * fília Ierúsalem: ecce, Rex tuus véniet tibi: Sion noli timére, qui cito véniet salus tua.'
        psalms:
        - number: '26'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '27'
      - type: psalmody
        antiphon: Rex noster * advéniet Christus, quem Ioánnes prædicávit Agnum esse ventúrum.
        psalms:
        - number: '28'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '29'
      - type: psalmody
        antiphon: 'Ecce, vénio * cito et merces mea mecum est, dicit Dóminus: dare unicuíque secúndum ópera sua.'
        psalms:
        - number: '30'
      - type: psalmody
        antiphon: ''
        psalms:
        - number: '31'
      - type: versicle
        text: Emítte Agnum, Dómine, Dominatórem terræ.
      - type: response
        text: De petra desérti ad montem fíliæ Sion.
      - type: psalmody
        antiphon: 'Gábriel Ángelus * locútus est Maríæ, dicens: Ave, grátia plena; Dóminus tecum; Benedícta tu in mulíeres.'
