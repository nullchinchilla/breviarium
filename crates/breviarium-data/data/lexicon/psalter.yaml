        - number: '118'
          start: '89'
          end: '96'
        - number: '118'
          start: '97'
          end: '104'
      - type: table_row
        label: Nona Feria II
        text: 'Let your hand be upon me, * O Lord, to save me: for I have chosen your commandments.'
