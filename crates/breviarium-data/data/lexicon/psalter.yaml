        psalms:
        - number: '17'
      - type: versicle
        text: 上主，请遣派那主宰大地的羔羊。
      - type: response
        text: 从旷野的磐石，至熙雍女儿的山岭。
      - type: psalmody
        antiphon: 天使加俾额尔 * 向玛利亚说：万福，充满恩宠者；上主与你同在；在女人中你是蒙祝福的。
        psalms:
        - number: '18'
      - type: psalmody
        antiphon: 玛利亚说： * 这样的请安有什么意思呢？我的心灵惊惶不安，因为我将要生下一位君王，祂不会破坏我童贞之封印。
        psalms:
        - number: '19'
