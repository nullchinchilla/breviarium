        antiphon: 当存敬畏的心事奉主， * 又当战兢而快乐。
        psalms:
        - number: '2'
      - type: psalmody
        antiphon: 我的神啊，求你兴起， * 主啊，求你拯救我。
        psalms:
        - number: '3'
