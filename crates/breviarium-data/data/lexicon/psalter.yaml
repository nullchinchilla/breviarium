      la:
      - type: versicle
        text: Érue a frámea, Deus, ánimam meam.
      - type: response
        text: Et de manu canis únicam meam.
      en:
      - type: versicle
        text: Rescue from the sword, O God, my soul.
      - type: response
        text: And my only one from the hand of the dog.
      zhs-ecu:
      - type: versicle
        text: 神啊，求你救我的性命脱离刀剑。
      - type: response
        text: 救我仅有的脱离犬类。
      zhs:
      - type: versicle
        text: 天主，求祢由刀剑下抢救我的灵魂。
      - type: response
        text: 由恶犬的爪牙拯救我的生命。
  psalmody.sc-pulis-suis-obumbr-bit-tibi-5dca3a5a24:
    role: psalmody
    content:
      en-dr:
      - type: versicle
        text: He will overshadow thee with his shoulders.
      - type: response
        text: And under his wings thou shalt trust.
      la:
      - type: versicle
        text: Scápulis suis obumbrábit tibi.
      - type: response
        text: Et sub pennis eius sperábis.
      en:
      - type: versicle
        text: He will overshadow you with his shoulders.
      - type: response
        text: And under his wings you shall hope.
      zhs-ecu:
      - type: versicle
        text: 他必用自己的翎毛遮蔽你。
      - type: response
        text: 你要投靠在他的翅膀底下。
      zhs:
      - type: versicle
        text: 他以自己的羽毛掩护你。
      - type: response
        text: 又叫你往他的翼下逃避。
  psalmody.scuto-circ-mdabit-te-v-ritas-eius-7ec575bf56:
    role: psalmody
    content:
      en-dr:
      - type: versicle
        text: His truth shall compass thee with a shield.
      - type: response
        text: Thou shalt not be afraid of the terror of the night.
      la:
      - type: versicle
        text: Scuto circúmdabit te véritas eius.
      - type: response
        text: Non timébis a timóre noctúrno.
      en:
      - type: versicle
        text: His truth will surround you as a shield.
      - type: response
        text: You will not fear the terror of the night.
      zhs-ecu:
      - type: versicle
        text: 他的信实必如盾牌护卫你。
      - type: response
        text: 你必不怕黑夜的惊骇。
