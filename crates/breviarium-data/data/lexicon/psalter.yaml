texts:
  psalmody.1-anim-impi-rum-frem-bant-adv-rsum-me-et-grav-tu-d0d4b66e6f:
    role: psalmody
    content:
      la:
      - type: text
        text: |-
          1 = Animæ impiórum fremébant advérsum me: et gravátum est cor meum super eos.
          2 = Iudicásti, Dómine, * causam ánimæ meæ, defénsor vitæ meæ, Dómine, Deus meus.
          3 = Pópule meus, * quid feci tibi? aut quid moléstus fui? Respónde mihi.
      - type: table_row
        label: '4'
      - type: text
        text: 5 = Numquid rédditur * pro bono malum, quia fodérunt fóveam ánimæ meæ.
      en:
      - type: text
        text: |-
          1 = The souls of the wicked raged against me: and my heart was heavy on their account.
          2 = You have judged, O Lord, * the cause of my soul; you, O Lord my God, are the defender of my life.
          3 = O my people, * what have I done to you? Or in what have I been a burden to you? Answer me.
      - type: table_row
        label: '4'
      - type: text
        text: 5 = Is evil rendered * for good, because they have dug a pit for my soul?
      zhs-ecu:
      - type: text
        text: |-
          1 = 恶人的心怒气冲冲地与我作对：我的心也为他们沉重。
          2 = 主啊，你已审断 * 我性命的案件，我生命的护卫者，主我的神啊。
          3 = 我的百姓哪， * 我向你做了什么？我何曾使你为难？请回答我。
      - type: table_row
        label: '4'
      - type: text
        text: 5 = 岂可 * 以恶报善呢？他们竟为我的性命挖了陷坑。
      zhs:
      - type: text
        text: |-
          1 = 恶人的灵魂怒气冲冲地攻击我，我心中为他们而沉重。
          2 = 上主，祢辩护了我灵魂的案件， * 上主，我的天主，祢是我生命的捍卫者。
          3 = 我的子民啊，* 我对你做了什么？我使你受了什么烦扰？请你回答我。
      - type: table_row
        label: '4'
      - type: text
        text: 5 = 难道 * 以恶报善，因为他们挖了一个坑穴来陷害我的灵魂。
  psalmody.1-anim-impi-rum-frem-bant-adv-rsum-me-et-grav-tu-f5dccdd3e3:
    role: psalmody
    content:
      la:
      - type: text
        text: '1 = Animæ impiórum fremébant advérsum me: et gravátum est cor meum super eos.'
      en:
      - type: text
        text: '1 = The souls of the wicked raged against me: and my heart was heavy on their account.'
      zhs-ecu:
      - type: text
        text: 1 = 恶人的心怒气冲冲地与我作对：我的心也为他们沉重。
      zhs:
      - type: text
        text: 1 = 恶人的灵魂怒气冲冲地攻击我：我心中为他们而沉重。
  psalmody.1-c-nite-tuba-in-sion-quia-prope-est-dies-d-mini-fdad16dc6d:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          1 = Blow ye the trumpet * in Sion, for the day of the Lord is near: behold, he shall come to save us, alleluia, alleluia.
          2 = Behold, he shall come * the desire of all nations: and the house of the Lord shall be filled with glory, alleluia.
          3 = The crooked * shall become straight, and the rough ways plain: come, O Lord, and do not tarry, alleluia.
          4 = The Lord shall come, * go ye out to meet him and say: a mighty Prince, of whose kingdom there shall be no end: God, the Strong One, Ruler, Prince of peace, alleluia, alleluia.
          5 = Thy almighty Word, * O Lord, shall come from the royal throne, alleluia.
      la:
      - type: text
        text: |-
          1 = Cánite tuba * in Sion, quia prope est dies Dómini: ecce véniet ad salvándum nos, allelúia, allelúia.
          2 = Ecce véniet * desiderátus cunctis Géntibus: et replébitur glória domus Dómini, allelúia.
          3 = Erunt prava * in dirécta, et áspera in vias planas: veni, Dómine, et noli tardáre, allelúia.
          4 = Dóminus véniet, * occúrrite illi, dicéntes: Magnum princípium, et regni eius non erit finis: Deus, Fortis, Dominátor, Princeps pacis, allelúia, allelúia.
          5 = Omnípotens Sermo tuus, * Dómine, a regálibus sédibus véniet, allelúia.
      en:
      - type: text
        text: |-
          1 = Blow the trumpet * in Sion, for the day of the Lord is near: behold, he will come to save us, alleluia, alleluia.
          2 = Behold, he will come, * the One desired by all the nations: and the house of the Lord shall be filled with glory, alleluia.
          3 = The crooked ways * shall be made straight, and the rough ways into smooth paths: come, O Lord, and delay not, alleluia.
          4 = The Lord will come, * go out to meet him, saying: Great is his dominion, and of his kingdom there shall be no end: God, the Mighty, the Ruler, the Prince of peace, alleluia, alleluia.
          5 = Your almighty Word, * O Lord, will come from his royal throne, alleluia.
      zhs-ecu:
      - type: text
        text: |-
          1 = 你们要在锡安 * 吹角，因为主的日子近了：看哪，他要来拯救我们，阿肋路亚，阿肋路亚。
          2 = 看哪，万国所仰望的 * 必要来到：主殿的荣耀必充满全地，阿肋路亚。
          3 = 弯曲的 * 必成正直，崎岖的必成平坦：主啊，求你来，不要迟延，阿肋路亚。
          4 = 主必要来， * 你们要前去迎接他，说：他是伟大的元首，他的国必无穷尽：神、全能者、主宰、和平之君，阿肋路亚，阿肋路亚。
          5 = 主啊，你全能的圣言 * 必从王者的宝座降来，阿肋路亚。
      zhs:
      - type: text
        text: |-
          1 = 在熙雍 * 吹响号角，因为上主的日子临近：看，他要来拯救我们，阿肋路亚，阿肋路亚。
          2 = 看，万民所渴望的 * 将要来临；上主的圣殿将充满光荣，阿肋路亚。
          3 = 弯曲的要变成直路，* 崎岖的要变成坦途：上主，请来，不要迟延，阿肋路亚。
          4 = 上主要来临，* 出去迎接他，说：伟大的主权，他的国没有终结：全能的天主，大能者，统治者，和平之王，阿肋路亚，阿肋路亚。
          5 = 上主，你全能的圣言 * 将从王者的宝座降临，阿肋路亚。
  psalmody.1-const-ntes-est-te-vid-bitis-aux-lium-d-mini-su-8f06c781ef:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          1 = Stand still * and you shall see the salvation of the Lord.
          2 = Unto thee, O Lord, * lift I up my soul; come and deliver me, O Lord, in thee do I put my trust.
          3 = Come, O Lord, * and make no tarrying; loosen the bonds of thy people Israel.
          4 = God shall come from Lebanon, * and his brightness shall be as the light.
          5 = Therefore I shall look unto the Lord, * I shall wait for God my Saviour.
      la:
      - type: text
        text: |-
          1 = Constántes estóte, * vidébitis auxílium Dómini super vos.
          2 = Ad te, Dómine, * levávi ánimam meam: veni, et éripe me, Dómine, ad te confúgi.
          3 = Veni, Dómine, * et noli tardáre: reláxa facínora plebi tuæ Israël.
          4 = Deus a Líbano véniet, * et splendor eius sicut lumen erit.
          5 = Ego autem * ad Dóminum aspíciam, et exspectábo Deum, Salvatórem meum.
      en:
      - type: text
        text: |-
          1 = Stand firm, * and you shall see the help of the Lord upon you.
          2 = To you, O Lord, * I have lifted up my soul: come and deliver me, O Lord; in you I have taken refuge.
          3 = Come, O Lord, * and delay not: forgive the sins of your people Israel.
          4 = God will come from Lebanon, * and his brightness shall be like the light.
          5 = But I * will look to the Lord, and will wait for God my Savior.
      zhs-ecu:
      - type: text
        text: |-
          1 = 你们要坚定， * 必看见主的拯救临到你们。
          2 = 主啊，我的心 * 仰望你：主啊，求你来搭救我，我已投奔于你。
          3 = 主啊，求你来， * 不要迟延：求你赦免你子民以色列的罪行。
          4 = 神必从黎巴嫩而来， * 他的光辉如同光明。
          5 = 至于我， * 我要仰望主，我要等候神我的救主。
      zhs:
      - type: text
        text: |-
          1 = 要坚定不移，* 你们将看见上主对你们的扶助。
          2 = 上主，* 我向你举起我的灵魂：请来，救我，上主，我已投奔于你。
          3 = 上主，请来，* 不要迟延：宽赦你子民以色列的罪过。
          4 = 天主将从黎巴嫩降临，* 他的光辉将如日光照耀。
          5 = 但我 * 仰望上主，等待我的天主，我的救主。
  psalmody.1-de-sion-v-niet-d-minus-omn-potens-ut-salvum-f-2b7d6ccb47:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          1 = The Lord, the Almighty, * cometh out of Zion, to save his people.
          2 = Turn thee, O Lord, * at the last, and tarry not to come unto thy servants.
          3 = The Lord that shall rule * shall come forth from Zion, Emmanuel is his name, and his name is great.
          4 = Behold, he is my God, * and I will glorify him my father's God, and I will exalt him.
          5 = The Lord our Law-giver, * the Lord our King, he cometh and will save us.
      la:
      - type: text
        text: |-
          1 = De Sion * véniet Dóminus omnípotens, ut salvum fáciat pópulum suum.
          2 = Convértere, Dómine, * aliquántulum, et ne tardes veníre ad servos tuos.
          3 = De Sion * véniet, qui regnatúrus est Dóminus, Emmánuel magnum nomen eius.
          4 = Ecce Deus meus, * et honorábo eum: Deus patris mei, et exaltábo eum.
          5 = Dóminus * légifer noster, Dóminus Rex noster, ipse véniet, et salvábit nos.
      en:
      - type: text
        text: |-
          1 = From Sion * the almighty Lord will come, to save his people.
          2 = Turn to us, O Lord, * for a little while, and delay not in coming to your servants.
          3 = From Sion * he will come who is to reign, the Lord Emmanuel, great is his name.
          4 = This is my God, * and I will honor him: the God of my father, and I will exalt him.
          5 = The Lord * is our lawgiver, the Lord is our King; he himself will come and save us.
      zhs-ecu:
      - type: text
        text: |-
          1 = 全能的主 * 必从锡安而来，拯救他的百姓。
          2 = 主啊，求你回心转意， * 不要迟延来到你仆人这里。
          3 = 那要作王的主 * 必从锡安而来，他的大名是以马内利。
          4 = 看哪，这是我的神， * 我要颂扬他：他是我父亲的神，我要尊崇他。
          5 = 主 * 是我们的立法者，主是我们的君王，他必要来拯救我们。
      zhs:
      - type: text
        text: |-
          1 = 全能的上主 * 将从熙雍降临，拯救他的子民。
          2 = 上主，请回转过来，* 不要迟延，来到你仆人们这里。
          3 = 将要执掌王权的上主 * 将从熙雍降临，厄玛奴尔是他的伟大名号。
          4 = 看，这是我的天主，* 我要光荣他；他是我父的天主，我要高扬他。
          5 = 上主 * 是我们的立法者，上主是我们的君王，他自己将来拯救我们。
  psalmody.1-ecce-in-n-bibus-c-li-d-minus-v-niet-cum-potest-2ad0f05d68:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          1 = Behold in the clouds of heaven * the Lord is coming with great power and majesty, alleluia.
          2 = Sion, the city of our strength, * a saviour, a wall and a bulwark shall be set therein: open ye the gates, because God is with us, alleluia.
          3 = Behold, the Lord shall appear, * and he shall not lie: if he make any delay, wait for him: for he shall surely come, and shall not be slack, alleluia.
          4 = The mountains and the hills * shall sing praise before God, and all the trees of the country shall clap their hands: for the Lord God shall come into his eternal kingdom, alleluia, alleluia.
          5 = Behold, our Lord * shall come with power, and give light to the eyes of his servants, alleluia.
      la:
      - type: text
        text: |-
          1 = Ecce in núbibus cæli * Dóminus véniet cum potestáte magna, allelúia.
          2 = Urbs fortitúdinis * nostræ Sion, Salvátor ponétur in ea murus et antemurále: aperíte portas, quia nobíscum Deus, allelúia.
          3 = Ecce apparébit * Dóminus, et non mentiétur: si moram fécerit, exspécta eum, quia véniet, et non tardábit, allelúia.
          4 = Montes et colles * cantábunt coram Deo laudem, et ómnia ligna silvárum plaudent mánibus: quóniam véniet Dominátor Dóminus in regnum ætérnum, allelúia, allelúia.
          5 = Ecce Dóminus * noster cum virtúte véniet, et illuminábit óculos servórum suórum, allelúia.
      en:
      - type: text
        text: |-
          1 = Behold, in the clouds of heaven * the Lord will come with great power, alleluia.
          2 = Our city of strength * is Sion; the Savior shall be set up as its wall and bulwark: open the gates, for God is with us, alleluia.
          3 = Behold, the Lord will appear, * and will not lie: if he tarry, wait for him, for he will come and will not delay, alleluia.
          4 = The mountains and hills * shall sing praise before God, and all the trees of the forest shall clap their hands: for the Lord the Ruler shall come into the eternal kingdom, alleluia, alleluia.
          5 = Behold, our Lord * will come with power, and will enlighten the eyes of his servants, alleluia.
      zhs-ecu:
      - type: text
        text: |-
          1 = 看哪，主必驾着天上的云 * 大有权能而来，阿肋路亚。
          2 = 锡安是我们坚固的城， * 救主必立为其中的城墙和外垒：你们当敞开城门，因为神与我们同在，阿肋路亚。
          3 = 看哪，主必显现， * 他绝不虚谎：他若迟延，仍要等候他，因为他必来到，绝不迟延，阿肋路亚。
          4 = 山岳丘陵 * 必在神面前歌唱赞美，林中一切的树都要拍掌：因为主宰之主必来掌管永远的国，阿肋路亚，阿肋路亚。
          5 = 看哪，我们的主 * 必大有能力而来，必照亮他仆人的眼睛，阿肋路亚。
      zhs:
      - type: text
        text: |-
          1 = 看，上主 * 将驾天上的云彩，以大能降临，阿肋路亚。
          2 = 熙雍是我们坚固的城，* 救主要在其中设置城墙和防垒：敞开城门，因为天主与我们同在，阿肋路亚。
          3 = 看，上主 * 将要显现，他不会爽约：若他耽延，你要等候他，因为他必来，绝不迟缓，阿肋路亚。
          4 = 山岭与丘陵 * 将在天主前歌唱赞颂，森林中万树将鼓掌欢呼：因为主宰上主将永远为王而来，阿肋路亚，阿肋路亚。
          5 = 看，我们的上主 * 将以大能降临，光照他仆人们的眼目，阿肋路亚。
  psalmody.1-ecce-v-niet-d-minus-princeps-regum-terr-be-ti-a11daf8e38:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          1 = Behold, the Lord cometh, * the Prince of the Kings of the earth: blessed are they that are ready to go forth to meet him.
          2 = When the Son of man cometh, * shall he find faith on the earth?
          3 = Behold, the fulness * of the time is come, when God sent forth his Son into the world.
          4 = With joy * shall ye draw water out of the wells of the Saviour.
          5 = The Lord goeth forth * from his holy place; he cometh to save his people.
      la:
      - type: text
        text: |-
          1 = Ecce, véniet * Dóminus princeps regum terræ: beáti, qui paráti sunt occúrrere illi.
          2 = Cum vénerit * Fílius hóminis, putas, invéniet fidem super terram?
          3 = Ecce, iam venit * plenitúdo témporis, in quo misit Deus Fílium suum in terras.
          4 = Hauriétis aquas * in gáudio de fóntibus Salvatóris.
          5 = Egrediétur * Dóminus de loco sancto suo: véniet, ut salvet pópulum suum.
      en:
      - type: text
        text: |-
          1 = Behold, the Lord shall come, * the prince of the kings of the earth: blessed are they who are prepared to meet him.
          2 = When the Son of Man comes, * do you think he will find faith on earth?
          3 = Behold, now the fullness of time has come, * in which God sent his Son into the world.
          4 = You shall draw waters * with joy from the fountains of the Savior.
          5 = The Lord * will go forth from his holy place: he will come to save his people.
      zhs-ecu:
      - type: text
        text: |-
          1 = 看哪，主 * 地上君王的元首必要来到：那些预备好迎接他的人有福了。
          2 = 人子来的时候， * 你想他在地上能找到信德吗？
          3 = 看哪，时期的满全 * 已经来到，神在此时差遣他的子降世。
          4 = 你们必从救主的泉源中 * 欢然取水。
          5 = 主 * 必从他的圣所出来：他必要来拯救他的百姓。
      zhs:
      - type: text
        text: |-
          1 = 看，地上众王的王宰上主 * 将要来临：蒙福的是那准备好了去迎接他的人。
          2 = 人子来临时，* 你想，他会在地上找到信德吗？
          3 = 看，天主差遣他的圣子来到大地 * 那时机成熟的时候已经来到。
          4 = 你们将以喜乐 * 从救主的泉源中汲水。
          5 = 上主 * 将从他的圣所出发：他要来拯救他的子民。
  psalmody.1-in-illa-die-still-bunt-montes-dulc-dinem-et-co-a197218495:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          1 = In that day * the mountains shall drop sweetness, and the hills shall flow with milk and honey, alleluia.
          2 = Rejoice greatly, * O daughter of Sion, shout for joy, O daughter of Jerusalem, alleluia.
          3 = Behold the Lord will come, * and all his Saints with him: and in that day there shall be a great light, alleluia.
          4 = All ye that thirst, * come to the waters: seek the Lord, while he may be found, alleluia.
          5 = Behold, there will come * a great Prophet, and he shall renew Jerusalem, alleluia.
      la:
      - type: text
        text: |-
          1 = In illa die * stillábunt montes dulcédinem, et colles fluent lac et mel, allelúia.
          2 = Iucundáre, * fília Sion, et exsúlta satis, fília Ierúsalem, allelúia.
          3 = Ecce Dóminus véniet, * et omnes Sancti eius cum eo: et erit in die illa lux magna, allelúia.
          4 = Omnes sitiéntes, * veníte ad aquas: quærite Dóminum, dum inveníri potest, allelúia.
          5 = Ecce véniet * Prophéta magnus, et ipse renovábit Ierúsalem, allelúia.
      en:
      - type: text
        text: |-
          1 = In that day * the mountains shall drip sweetness, and the hills shall flow with milk and honey, alleluia.
          2 = Rejoice, * O daughter of Sion, and exult greatly, O daughter of Jerusalem, alleluia.
          3 = Behold, the Lord will come, * and all his Saints with him: and there shall be great light on that day, alleluia.
          4 = All you who thirst, * come to the waters: seek the Lord while he may be found, alleluia.
          5 = Behold, the great Prophet will come, * and he himself will renew Jerusalem, alleluia.
      zhs-ecu:
      - type: text
        text: |-
          1 = 当那日， * 群山要滴下甘甜，丘陵要流出奶与蜜，阿肋路亚。
          2 = 锡安的女子啊， * 你要欢欣，耶路撒冷的女子啊，你要大大快乐，阿肋路亚。
          3 = 看哪，主必要来， * 他众圣者都与他同来：在那日必有大光，阿肋路亚。
          4 = 你们一切干渴的人哪， * 都来就水：当趁主可寻见的时候寻求他，阿肋路亚。
          5 = 看哪，伟大的先知 * 必要来到，他必更新耶路撒冷，阿肋路亚。
      zhs:
      - type: text
        text: |-
          1 = 在那一天，* 群山将滴下甘甜，丘陵将流出乳与蜜，阿肋路亚。
          2 = 欢欣吧，* 熙雍的女儿，尽情欢呼吧，耶路撒冷的女儿，阿肋路亚。
          3 = 看，上主将来临，* 他的众圣人也与他同来：那一天将有大光明，阿肋路亚。
          4 = 所有口渴的人，* 请来取水：趁上主可以寻觅时，求告他，阿肋路亚。
          5 = 看，伟大的先知 * 将要来临，他自己将更新耶路撒冷，阿肋路亚。
  psalmody.1-intu-mini-quam-sit-glori-sus-iste-qui-ingr-dit-6a99d5ee4c:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          1 = Consider how glorious is the one * who shall bring about the salvation of the peoples.
          2 = His kingdom shall increase, * and of his peace there shall be no end.
          3 = I, the Lord, have brought my justice near, * it shall not be afar off, and my salvation shall not delay.
          4 = May the speech of the Lord be awaited like rain: * and the Lord our God descend like dew upon us.
          5 = Let Israel be ready * to go out to meet the Lord, for he is coming.
      la:
      - type: text
        text: |-
          1 = Intuémini, * quam sit gloriósus iste, qui ingréditur ad salvándos pópulos.
          2 = Multiplicábitur * eius impérium, et pacis non erit finis.
