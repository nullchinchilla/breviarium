  psalmody.allel-ia-confit-mini-d-mino-qu-niam-in-s-culum-m-f9c1d108b0:
    role: psalmody
    content:
      en-dr:
      - type: table_row
        label: sunday
        text: Alleluia, * Give glory to the Lord, for his mercy endureth for ever, alleluia, alleluia.
        psalms:
        - number: '117'
        - number: '118'
          start: '1'
          end: '16'
        - number: '118'
          start: '17'
          end: '32'
      - type: table_row
        label: monday
        text: The innocent in hands * and clean of heart shall ascend the mountain of the Lord.
        psalms:
        - number: '23'
        - number: '18'
          start: '2'
          end: 7b
        - number: '18'
          start: '8'
          end: 15b
        - number: '46'
          optional: true
      - type: table_row
        label: tuesday
        text: In thee, O my God, * I put my trust; let me not be ashamed.
        psalms:
        - number: '24'
          start: '1'
          end: '7'
        - number: '24'
          start: '8'
          end: '14'
        - number: '24'
          start: '15'
          end: '22'
        - number: '95'
          optional: true
      - type: table_row
        label: wednesday
        text: For thy mercy, * O Lord, is before my eyes; and I am well pleased with thy truth.
        psalms:
        - number: '25'
        - number: '51'
        - number: '52'
        - number: '96'
          optional: true
      - type: table_row
        label: thursday
        text: The Lord hath set me * in a place of pasture.
        psalms:
        - number: '22'
        - number: '71'
          start: '2'
          end: '8'
        - number: '71'
          start: '9'
          end: '19'
        - number: '97'
          optional: true
      - type: table_row
        label: friday
        text: Depart not from me, * O Lord, for tribulation is very near; for there is none to help me.
        psalms:
        - number: '21'
          start: '2'
          end: '12'
        - number: '21'
          start: '13'
          end: '23'
        - number: '21'
          start: '24'
          end: '32'
        - number: '98'
          optional: true
      - type: table_row
        label: saturday
        text: 'Lift up thyself, O Lord, * thou that judgest the earth: render retribution to the proud.'
        psalms:
        - number: '93'
          start: '1'
          end: '11'
        - number: '93'
          start: '12'
          end: '23'
        - number: '107'
        - number: '149'
          optional: true
      la:
      - type: table_row
        label: sunday
        text: Allelúia, * confitémini Dómino, quóniam in sǽculum misericórdia eius, allelúia, allelúia.
        psalms:
        - number: '117'
        - number: '118'
          start: '1'
          end: '16'
        - number: '118'
          start: '17'
          end: '32'
      - type: table_row
        label: monday
        text: Ínnocens mánibus * et mundo corde ascéndet in montem Dómini.
        psalms:
        - number: '23'
        - number: '18'
          start: '2'
          end: 7b
        - number: '18'
          start: '8'
          end: 15b
        - number: '46'
          optional: true
      - type: table_row
        label: tuesday
        text: Deus meus * in te confído non erubéscam.
        psalms:
        - number: '24'
          start: '1'
          end: '7'
        - number: '24'
          start: '8'
          end: '14'
        - number: '24'
          start: '15'
          end: '22'
        - number: '95'
          optional: true
      - type: table_row
        label: wednesday
        text: 'Misericórdia tua, * Dómine, ante óculos meos: et complácui in veritáte tua.'
        psalms:
        - number: '25'
        - number: '51'
        - number: '52'
        - number: '96'
          optional: true
      - type: table_row
        label: thursday
        text: In loco páscuæ * ibi Dóminus me collocávit.
        psalms:
        - number: '22'
        - number: '71'
          start: '2'
          end: '8'
        - number: '71'
          start: '9'
          end: '19'
        - number: '97'
          optional: true
      - type: table_row
        label: friday
        text: 'Ne discédas a me, * Dómine: quóniam tribulátio próxima est: quóniam non est qui ádiuvet.'
        psalms:
        - number: '21'
          start: '2'
          end: '12'
        - number: '21'
          start: '13'
          end: '23'
        - number: '21'
          start: '24'
          end: '32'
        - number: '98'
          optional: true
      - type: table_row
        label: saturday
        text: 'Exaltáre, Dómine, * qui iúdicas terram: redde retributiónem supérbis.'
        psalms:
        - number: '93'
          start: '1'
          end: '11'
        - number: '93'
          start: '12'
          end: '23'
        - number: '107'
        - number: '149'
          optional: true
      en:
      - type: table_row
        label: sunday
        text: Alleluia, * give praise to the Lord, for his mercy endures for ever, alleluia, alleluia.
        psalms:
        - number: '117'
        - number: '118'
          start: '1'
          end: '16'
        - number: '118'
          start: '17'
          end: '32'
      - type: table_row
        label: monday
        text: The innocent of hands * and pure of heart shall ascend the mountain of the Lord.
        psalms:
        - number: '23'
        - number: '18'
          start: '2'
          end: 7b
        - number: '18'
          start: '8'
          end: 15b
        - number: '46'
          optional: true
      - type: table_row
        label: tuesday
        text: My God, * in you I trust; I shall not be put to shame.
        psalms:
        - number: '24'
          start: '1'
          end: '7'
        - number: '24'
          start: '8'
          end: '14'
        - number: '24'
          start: '15'
          end: '22'
        - number: '95'
          optional: true
      - type: table_row
        label: wednesday
        text: 'Your mercy, * O Lord, is before my eyes: and I have been pleasing in your truth.'
        psalms:
        - number: '25'
        - number: '51'
        - number: '52'
        - number: '96'
          optional: true
      - type: table_row
        label: thursday
        text: In a place of pasture * there the Lord has settled me.
        psalms:
        - number: '22'
        - number: '71'
          start: '2'
          end: '8'
        - number: '71'
          start: '9'
          end: '19'
        - number: '97'
          optional: true
      - type: table_row
        label: friday
        text: 'Do not depart from me, * O Lord: for tribulation is near: for there is none to help.'
        psalms:
        - number: '21'
          start: '2'
          end: '12'
        - number: '21'
          start: '13'
          end: '23'
        - number: '21'
          start: '24'
          end: '32'
        - number: '98'
          optional: true
      - type: table_row
        label: saturday
        text: 'Be exalted, O Lord, * you who judge the earth: render retribution to the proud.'
        psalms:
        - number: '93'
          start: '1'
          end: '11'
        - number: '93'
          start: '12'
          end: '23'
        - number: '107'
        - number: '149'
          optional: true
      zhs-ecu:
      - type: table_row
        label: sunday
        text: 阿肋路亚， * 你们要称谢主，因他的慈爱永远长存，阿肋路亚，阿肋路亚。
        psalms:
        - number: '117'
        - number: '118'
          start: '1'
          end: '16'
        - number: '118'
          start: '17'
          end: '32'
      - type: table_row
        label: monday
        text: 手洁心清的人 * 必登上主的山。
        psalms:
        - number: '23'
        - number: '18'
          start: '2'
          end: 7b
        - number: '18'
          start: '8'
          end: 15b
        - number: '46'
          optional: true
      - type: table_row
        label: tuesday
        text: 我的神啊， * 我倚靠你，求你叫我不致蒙羞。
        psalms:
        - number: '24'
          start: '1'
          end: '7'
        - number: '24'
          start: '8'
          end: '14'
        - number: '24'
          start: '15'
          end: '22'
        - number: '95'
          optional: true
      - type: table_row
        label: wednesday
        text: 主啊，你的慈爱 * 常在我眼前；我也按你的真理而行。
        psalms:
        - number: '25'
        - number: '51'
        - number: '52'
        - number: '96'
          optional: true
      - type: table_row
        label: thursday
        text: 主使我躺卧在 * 青草地上。
        psalms:
        - number: '22'
        - number: '71'
          start: '2'
          end: '8'
        - number: '71'
          start: '9'
          end: '19'
        - number: '97'
          optional: true
      - type: table_row
        label: friday
        text: 主啊，求你不要远离我， * 因为急难临近了，没有人帮助。
        psalms:
        - number: '21'
          start: '2'
          end: '12'
        - number: '21'
          start: '13'
          end: '23'
        - number: '21'
          start: '24'
          end: '32'
        - number: '98'
          optional: true
      - type: table_row
        label: saturday
        text: 审判世界的主啊，求你挺身而起， * 给骄傲人应得的报应。
        psalms:
        - number: '93'
          start: '1'
          end: '11'
        - number: '93'
          start: '12'
          end: '23'
        - number: '107'
        - number: '149'
          optional: true
      zhs:
      - type: table_row
        label: sunday
        text: 阿肋路亚，* 请你们向上主赞颂，因为他是美善宽仁，他的仁慈永远常存，阿肋路亚，阿肋路亚。
        psalms:
        - number: '117'
        - number: '118'
          start: '1'
          end: '16'
        - number: '118'
          start: '17'
          end: '32'
      - type: table_row
        label: monday
        text: 手洁心清的人，* 能够登上上主的圣山。
        psalms:
        - number: '23'
        - number: '18'
          start: '2'
          end: 7b
        - number: '18'
          start: '8'
          end: 15b
        - number: '46'
          optional: true
      - type: table_row
        label: tuesday
        text: 我的天主，* 我全心倚靠你，不致蒙受羞耻。
        psalms:
        - number: '24'
          start: '1'
          end: '7'
        - number: '24'
          start: '8'
          end: '14'
        - number: '24'
          start: '15'
          end: '22'
        - number: '95'
          optional: true
      - type: table_row
        label: wednesday
        text: 你的慈爱，* 上主，常摆在我眼前；我常遵照你的真理行走。
        psalms:
        - number: '25'
        - number: '51'
        - number: '52'
        - number: '96'
          optional: true
      - type: table_row
        label: thursday
        text: 在青绿的草场，* 上主使我安居其中。
        psalms:
        - number: '22'
        - number: '71'
          start: '2'
          end: '8'
        - number: '71'
          start: '9'
          end: '19'
        - number: '97'
          optional: true
      - type: table_row
        label: friday
        text: 不要离弃我，* 上主，因为磨难近在眼前，没有人能来帮助。
        psalms:
        - number: '21'
          start: '2'
          end: '12'
        - number: '21'
          start: '13'
          end: '23'
        - number: '21'
          start: '24'
          end: '32'
        - number: '98'
          optional: true
      - type: table_row
        label: saturday
        text: 审判大地的上主，请你起来，* 给骄傲人施以应得的祸灾。
        psalms:
        - number: '93'
          start: '1'
          end: '11'
        - number: '93'
          start: '12'
          end: '23'
        - number: '107'
        - number: '149'
          optional: true
