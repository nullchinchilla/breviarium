        - number: '118'
          start: '25'
          end: '32'
      - type: table_row
        label: Prima Feria II
        text: 'Serve ye the Lord with fear: * and rejoice unto him with trembling.'
        psalms:
        - number: '1'
        - number: '2'
        - number: '6'
      - type: table_row
        label: Prima Feria III
        text: God is a just judge * strong and patient, will He be angry every day?
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
          start: '2'
          end: '19'
      - type: table_row
        label: Prima Feria IV
        text: Arise, O Lord, * let not man be strengthened.
        psalms:
        - number: '9'
          start: '20'
          end: '39'
        - number: '10'
        - number: '11'
      - type: table_row
        label: Prima Feria V
        text: I shall sing to the Lord, * who hath given good things to me.
        psalms:
        - number: '12'
        - number: '13'
        - number: '14'
      - type: table_row
        label: Prima Feria VI
        text: Thou hast no need of my goods * preserve me, O Lord, for I have put my trust in thee.
        psalms:
        - number: '15'
        - number: '16'
        - number: '17'
          start: '2'
          end: '25'
      - type: table_row
        label: Prima Sabbato
        text: The Lord liveth, and blessed be my God, my salvation.
        psalms:
        - number: '17'
          start: '26'
          end: '51'
        - number: '18'
        - number: '19'
      - type: table_row
        label: Prima Festis
        text: Alleluia, * alleluia, alleluia (alleluia)
        psalms:
        - number: '118'
          start: '1'
          end: '8'
        - number: '118'
          start: '9'
          end: '16'
        - number: '118'
          start: '17'
          end: '24'
        - number: '118'
          start: '25'
          end: '32'
      - type: table_row
        label: Tertia Dominica
        text: Alleluia, * alleluia, alleluia (alleluia)
        psalms:
        - number: '118'
          start: '33'
          end: '40'
        - number: '118'
          start: '41'
          end: '48'
        - number: '118'
          start: '49'
          end: '56'
      - type: table_row
        label: Tertia Feria II
        text: Help me * and I shall be saved, O Lord.
        psalms:
        - number: '118'
          start: '105'
          end: '112'
        - number: '118'
          start: '113'
          end: '120'
        - number: '118'
          start: '121'
          end: '128'
      - type: table_row
        label: Tertia Feria
        text: I cried unto the Lord, * and He heard me.
        psalms:
        - number: '119'
        - number: '120'
        - number: '121'
      - type: table_row
        label: Sexta Dominica
        text: Alleluia, * alleluia, alleluia (alleluia)
        psalms:
        - number: '118'
          start: '57'
          end: '64'
        - number: '118'
          start: '65'
          end: '72'
        - number: '118'
          start: '73'
          end: '80'
      - type: table_row
        label: Sexta Feria II
        text: Look upon me * and have mercy on me.
        psalms:
        - number: '118'
          start: '129'
          end: '136'
        - number: '118'
          start: '137'
          end: '144'
        - number: '118'
          start: '145'
          end: '152'
      - type: table_row
        label: Sexta Feria
        text: Who dwellest * in heaven, have mercy on us.
        psalms:
        - number: '122'
        - number: '123'
        - number: '124'
      - type: table_row
        label: Nona Dominica
        text: Alleluia, * alleluia, alleluia (alleluia)
        psalms:
        - number: '118'
          start: '81'
          end: '88'
        - number: '118'
          start: '89'
          end: '96'
        - number: '118'
          start: '97'
          end: '104'
      - type: table_row
        label: Nona Feria II
        text: Let thy hand be with me to save me; * for I have chosen thy precepts.
        psalms:
        - number: '118'
          start: '153'
          end: '160'
        - number: '118'
          start: '161'
          end: '168'
        - number: '118'
          start: '169'
          end: '176'
      - type: table_row
        label: Nona Feria
        text: Blessed are all they * that fear the Lord.
        psalms:
        - number: '125'
        - number: '126'
        - number: '127'
      la:
      - type: table_row
        label: Prima Dominica
        text: Allelúia, * allelúia, allelúia (allelúia)
        psalms:
        - number: '118'
          start: '1'
          end: '8'
        - number: '118'
          start: '9'
          end: '16'
        - number: '118'
          start: '17'
          end: '24'
        - number: '118'
          start: '25'
          end: '32'
      - type: table_row
        label: Prima Feria II
        text: 'Servíte Dómino * in timóre: et exsultáte ei cum tremóre.'
