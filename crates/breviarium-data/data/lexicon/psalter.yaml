  psalmody.const-ntes-est-te-vid-bitis-aux-lium-d-mini-supe-a8be5a3238:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          Stand still * and you shall see the salvation of the Lord.
          Unto thee, O Lord, * lift I up my soul; come and deliver me, O Lord, in thee do I put my trust.
          Come, O Lord, * and make no tarrying; loosen the bonds of thy people Israel.
          God shall come from Lebanon, * and his brightness shall be as the light.
          Therefore I shall look unto the Lord, * I shall wait for God my Saviour.
      la:
      - type: text
        text: |-
          Constántes estóte, * vidébitis auxílium Dómini super vos.
          Ad te, Dómine, * levávi ánimam meam: veni, et éripe me, Dómine, ad te confúgi.
          Veni, Dómine, * et noli tardáre: reláxa facínora plebi tuæ Israël.
          Deus a Líbano véniet, * et splendor eius sicut lumen erit.
          Ego autem * ad Dóminum aspíciam, et exspectábo Deum Salvatórem meum.
      en:
      - type: text
        text: |-
          Stand firm, * and you shall see the help of the Lord upon you.
          To you, O Lord, * I have lifted up my soul: come, and deliver me, O Lord, in you I have taken refuge.
          Come, O Lord, * and delay not: forgive the transgressions of your people Israel.
          God will come from Lebanon, * and his splendor shall be as the light.
          But I * will look to the Lord, and will wait for God my Savior.
      zhs-ecu:
      - type: text
        text: |-
          你们要坚立， * 必看见主帮助你们。
          主啊，我的心 * 仰望你；求你来搭救我，主啊，我投奔了你。
          主啊，求你来， * 不要迟延：求你赦免你子民以色列的罪愆。
          神必从黎巴嫩而来， * 他的光辉如同光明。
          至于我， * 我要仰望主，等候拯救我的神。
      zhs:
      - type: text
        text: |-
          要坚定不移，* 你们将看见上主对你们的助佑。
          上主，我向祢把我的心举起，* 上主，求祢前来救拔我，因为我投靠祢。
          上主，快来吧，* 不要迟延：赦免祢以色列子民的罪恶。
          天主将从黎巴嫩来临，* 祂的光辉将如明光一样。
          至于我，* 我要仰望上主，寄望于拯救我的天主。
