        antiphon: 上主，请你兴起奋发，* 我的天主，求你救拔我。
        psalms:
        - number: '3'
      - type: versicle
        text: 上主，夜间我想起了你的圣名。
      - type: response
        text: 我就决意要遵守祢的法令。
      - type: psalmody
        antiphon: 上主，我们的主！你的名号 * 在普世何其美妙！
        psalms:
        - number: '8'
      - type: psalmody
        antiphon: 你登上宝座， * 秉公行义，为我审断了是非曲直。
        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: 上主，起来， * 莫让世人获胜！
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: 为了祢正义的判语，我半夜起身赞美祢。
      - type: response
        text: 为了祢那正义的判词。
      - type: psalmody
        antiphon: 上主，祢为什么 * 站在远处！
        psalms:
        - number: '9'
          start: '22'
          end: '32'
      - type: psalmody
        antiphon: 求祢起来， * 上主天主，将手举起！
        psalms:
        - number: '9'
          start: '33'
          end: '39'
      - type: psalmody
        antiphon: 上主是正义的， * 祂酷爱公正。
        psalms:
        - number: '10'
      - type: versicle
        text: 夜里每更我都睁着眼睛，全是为了默想祢的圣训。
      - type: response
        text: 全是为了默想祢的圣训，上主。
