  psalmody.de-sion-v-niet-d-minus-omn-potens-ut-salvum-f-ci-735824973d:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          The Lord, the Almighty, * cometh out of Zion, to save his people.
          Turn thee, O Lord, * at the last, and tarry not to come unto thy servants.
          The Lord that shall rule * shall come forth from Zion, Emmanuel is his name, and his name is great.
          Behold, he is my God, * and I will glorify him: my father's God, and I will exalt him.
          The Lord our Law-giver, * the Lord our King, he cometh and will save us.
      la:
      - type: text
        text: |-
          De Sion * véniet Dóminus omnípotens, ut salvum fáciat pópulum suum.
          Convértere, Dómine, * aliquántulum, et ne tardes veníre ad servos tuos.
          De Sion * véniet, qui regnatúrus est Dóminus, Emmánuel magnum nomen eius.
          Ecce Deus meus, * et honorábo eum: Deus patris mei, et exaltábo eum.
          Dóminus * légifer noster, Dóminus Rex noster, ipse véniet, et salvábit nos.
      en:
      - type: text
        text: |-
          The Lord Almighty will come from Zion * to save his people.
          Turn to us, * O Lord, a little while, and do not delay in coming to your servants.
          From Zion * will come the Lord who is to reign, Emmanuel is his great name.
          Behold my God, * and I will honor him: the God of my father, and I will exalt him.
          The Lord * is our lawgiver, the Lord our King, he himself will come and save us.
      zhs-ecu:
      - type: text
        text: |-
          全能的主必从锡安而来， * 为要拯救他的子民。
          主啊，求你回转， * 不要久延，求你速来到你仆人这里。
