      - type: psalmody
        antiphon: 装满自己箭囊的人，* 城门前与敌人争辩，不受羞耻。
        psalms:
        - number: '126'
      - type: psalmody
        antiphon: 不拘你是谁，* 只要你敬畏上主，就算有福！
        psalms:
        - number: '127'
      - type: psalmody
        antiphon: 从我少年，世人就与我为难，* 然而他们却未能将我推翻。
        psalms:
        - number: '128'
