        - number: '1'
        - number: '2'
        - number: '6'
      - type: table_row
        label: Prima Feria III
        text: O Lord * my God, in you have I hoped.
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
          start: '2'
          end: '19'
      - type: table_row
        label: Prima Feria V
        text: Enlighten * my eyes, O Lord.
        psalms:
        - number: '12'
        - number: '13'
        - number: '14'
      - type: table_row
        label: Prima Feria VI
        text: Keep me, * O Lord, for in you have I hoped.
        psalms:
        - number: '15'
        - number: '16'
        - number: '17'
          start: '2'
          end: '25'
      zhs-ecu:
      - type: table_row
        label: Prima Feria II
        text: 你们当存敬畏 * 事奉主。
        psalms:
        - number: '1'
        - number: '2'
        - number: '6'
      - type: table_row
        label: Prima Feria III
        text: 主 * 我的神啊，我曾倚靠你。
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
          start: '2'
          end: '19'
      - type: table_row
        label: Prima Feria V
        text: 主啊，求你光照 * 我的眼目。
        psalms:
        - number: '12'
        - number: '13'
        - number: '14'
      - type: table_row
        label: Prima Feria VI
        text: 主啊，求你保佑我， * 因为我投靠你。
        psalms:
        - number: '15'
        - number: '16'
        - number: '17'
          start: '2'
          end: '25'
      zhs:
      - type: table_row
        label: Prima Feria II
        text: 应以敬畏之情 * 事奉上主。
        psalms:
        - number: '1'
        - number: '2'
        - number: '6'
      - type: table_row
        label: Prima Feria III
        text: 上主，* 我的天主，我一心投奔祢。
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
          start: '2'
          end: '19'
      - type: table_row
        label: Prima Feria V
        text: 上主，赐我 * 眼目明亮。
        psalms:
        - number: '12'
        - number: '13'
        - number: '14'
      - type: table_row
        label: Prima Feria VI
        text: 天主，求祢保佑我，* 因为我只投靠祢。
        psalms:
        - number: '15'
        - number: '16'
        - number: '17'
          start: '2'
          end: '25'
  psalmody.serv-te-d-mino-in-tim-re-et-exsult-te-ei-cum-tre-4b29b42a25:
    role: psalmody
    content:
      en-dr:
      - type: psalmody
        antiphon: Serve the Lord with fear, and rejoice with trembling before Him.
        psalms:
        - number: '1'
        - number: '2'
        - number: '3'
        - number: '6'
      - type: psalmody
        antiphon: God is a righteous judge * strong, and patient is He not provoked every day?
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
        - number: '10'
      - type: psalmody
        antiphon: Thou shalt keep us, O Lord, and preserve us.
        psalms:
        - number: '11'
        - number: '12'
        - number: '13'
        - number: '14'
      - type: versicle
        text: I have remembered Thy name, O Lord, in the night.
      - type: response
        text: And have kept Thy law.
      - type: psalmody
        antiphon: Thou hast no need * of my goods, in Thee do I put my trust, preserve me, O Lord.
        psalms:
        - number: '15'
      - type: psalmody
        antiphon: By the words * of Thy lips I have kept me to strait paths.
        psalms:
        - number: '16'
      - type: psalmody
        antiphon: I will love Thee * O Lord, my strength.
        psalms:
        - number: '17'
      - type: versicle
        text: For Thou lightest my candle, O Lord.
      - type: response
        text: My God, enlighten my darkness.
      - type: psalmody
        antiphon: There is no speech * nor language where their voice is not heard.
        psalms:
        - number: '18'
      - type: psalmody
        antiphon: The Lord * hear thee in the day of trouble.
        psalms:
        - number: '19'
      - type: psalmody
        antiphon: The king * shall joy in Thy strength, O Lord.
        psalms:
        - number: '20'
      - type: versicle
        text: Be Thou exalted, O Lord, in Thine own strength.
      - type: response
        text: We will sing and praise Thy power.
      la:
      - type: psalmody
        antiphon: Servíte Dómino * in timóre, et exsultáte ei cum tremóre.
        psalms:
        - number: '1'
        - number: '2'
        - number: '3'
        - number: '6'
      - type: psalmody
        antiphon: Deus iudex * iustus fortis et longánimus, numquid irascétur per síngulos dies.
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
        - number: '10'
      - type: psalmody
        antiphon: Tu Dómine * servábis nos et custódies nos.
        psalms:
        - number: '11'
        - number: '12'
        - number: '13'
        - number: '14'
      - type: versicle
        text: Memor fui nocte nóminis tui, Dómine.
      - type: response
        text: Et custodívit legem tuam.
      - type: psalmody
        antiphon: Bonórum meórum * non índiges, in te sperávi, consérva, Dómine.
        psalms:
        - number: '15'
      - type: psalmody
        antiphon: Propter verba * labiórum tuórum ego custodívi vias duras.
        psalms:
        - number: '16'
      - type: psalmody
        antiphon: Díligam te * Dómine virtus mea.
        psalms:
        - number: '17'
      - type: versicle
        text: Quóniam illúminas lucérnam meam, Dómine.
      - type: response
        text: Deus meus illúmina ténebras meas.
      - type: psalmody
        antiphon: Non sunt loquélæ * neque sermónes quorum non audiántur voces eórum.
        psalms:
        - number: '18'
      - type: psalmody
        antiphon: Exáudiat * te Dóminus in die tribulatiónis.
        psalms:
        - number: '19'
      - type: psalmody
        antiphon: Dómine * in virtúte tua lætábitur rex.
        psalms:
        - number: '20'
      - type: versicle
        text: Exaltáre Dómine in virtúte tua.
      - type: response
        text: Cantábimus et psallémus virtútes tuas.
      en:
      - type: psalmody
        antiphon: Serve the Lord * in fear, and rejoice before him with trembling.
        psalms:
        - number: '1'
        - number: '2'
        - number: '3'
        - number: '6'
      - type: psalmody
        antiphon: God is a just judge, * strong and patient; does he not show wrath every day?
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
        - number: '10'
      - type: psalmody
        antiphon: You, O Lord, * will keep us and guard us.
        psalms:
        - number: '11'
        - number: '12'
        - number: '13'
        - number: '14'
      - type: versicle
        text: In the night I remembered your name, O Lord.
      - type: response
        text: And he kept his law.
      - type: psalmody
        antiphon: You have no need * of my goods; in you have I hoped, keep me, O Lord.
        psalms:
        - number: '15'
      - type: psalmody
        antiphon: For the sake of the words * of your lips I have kept hard ways.
        psalms:
        - number: '16'
      - type: psalmody
        antiphon: I will love you, * O Lord, my strength.
        psalms:
        - number: '17'
      - type: versicle
        text: For you, O Lord, will enlighten my lamp.
      - type: response
        text: My God, enlighten my darkness.
      - type: psalmody
        antiphon: There are no speeches * nor words whose voices are not heard.
        psalms:
        - number: '18'
      - type: psalmody
        antiphon: May the Lord hear * you in the day of tribulation.
        psalms:
        - number: '19'
      - type: psalmody
        antiphon: O Lord, * the king will rejoice in your strength.
        psalms:
        - number: '20'
      - type: versicle
        text: Be exalted, O Lord, in your power.
      - type: response
        text: We will sing and proclaim your mighty deeds.
      zhs-ecu:
      - type: psalmody
        antiphon: 当存敬畏的心事奉主， * 又当战兢而快乐。
        psalms:
        - number: '1'
        - number: '2'
        - number: '3'
        - number: '6'
      - type: psalmody
        antiphon: 神是公义的审判者， * 是大有能力、满有忍耐的，他岂会天天发怒。
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
        - number: '10'
      - type: psalmody
        antiphon: 主啊，你必 * 保守我们，护卫我们。
        psalms:
        - number: '11'
        - number: '12'
        - number: '13'
        - number: '14'
      - type: versicle
        text: 主啊，我夜间记念你的名。
      - type: response
        text: 并且遵守了你的律法。
      - type: psalmody
        antiphon: 你并不需要我的财物； * 我曾投靠你，主啊，求你保佑我。
        psalms:
        - number: '15'
      - type: psalmody
        antiphon: 因你嘴唇所出的言语， * 我遵守了艰难的道路。
        psalms:
        - number: '16'
      - type: psalmody
        antiphon: 主啊，我的力量， * 我要爱你。
        psalms:
        - number: '17'
      - type: versicle
        text: 主啊，因为你点着我的灯。
      - type: response
        text: 我的神啊，求你照明我的黑暗。
      - type: psalmody
        antiphon: 无言无语， * 也无声音可听。
        psalms:
        - number: '18'
      - type: psalmody
        antiphon: 愿主在你遭难的日子 * 应允你。
        psalms:
        - number: '19'
      - type: psalmody
        antiphon: 主啊， * 王必因你的能力欢喜。
        psalms:
        - number: '20'
      - type: versicle
        text: 主啊，愿你因自己的能力被尊崇。
      - type: response
        text: 我们必歌唱、歌颂你的大能。
      zhs:
      - type: psalmody
        antiphon: 应以敬畏之情事奉上主，* 战战兢兢向他欢呼。
        psalms:
        - number: '1'
        - number: '2'
        - number: '3'
        - number: '6'
      - type: psalmody
        antiphon: 天主是公义的审判者，* 强而有力，宽宏大量；祂难道每天都要发怒吗？
        psalms:
        - number: '7'
