          end: '40'
        - number: '118'
          start: '41'
          end: '48'
        - number: '118'
          start: '49'
          end: '56'
      - type: table_row
        label: Tertia Feria II
        text: 主啊，求你帮助我， * 我便得救。
        psalms:
        - number: '118'
          start: '105'
          end: '112'
        - number: '118'
          start: '113'
          end: '120'
        - number: '118'
          start: '121'
          end: '128'
      - type: table_row
        label: Tertia Feria
        text: 我呼求， * 他就垂听了我。
        psalms:
        - number: '119'
        - number: '120'
        - number: '121'
      - type: table_row
        label: Sexta Dominica
        text: 阿肋路亚， * 阿肋路亚，阿肋路亚（阿肋路亚）
        psalms:
        - number: '118'
          start: '57'
          end: '64'
        - number: '118'
          start: '65'
          end: '72'
        - number: '118'
          start: '73'
          end: '80'
      - type: table_row
        label: Sexta Feria II
        text: 主啊，求你眷顾我， * 怜恤我。
        psalms:
        - number: '118'
          start: '129'
          end: '136'
        - number: '118'
          start: '137'
          end: '144'
        - number: '118'
          start: '145'
          end: '152'
      - type: table_row
        label: Sexta Feria
        text: 你坐在 * 天上的，求你怜恤我们。
        psalms:
        - number: '122'
        - number: '123'
        - number: '124'
      - type: table_row
        label: Nona Dominica
        text: 阿肋路亚， * 阿肋路亚，阿肋路亚（阿肋路亚）
        psalms:
        - number: '118'
          start: '81'
          end: '88'
        - number: '118'
          start: '89'
          end: '96'
        - number: '118'
          start: '97'
          end: '104'
      - type: table_row
        label: Nona Feria II
        text: 主啊，愿你的手 * 拯救我，因我拣选了你的命令。
        psalms:
        - number: '118'
          start: '153'
          end: '160'
        - number: '118'
          start: '161'
          end: '168'
        - number: '118'
          start: '169'
          end: '176'
      - type: table_row
        label: Nona Feria II
        text: 主啊,愿你的手 * 拯救我，因我切慕你的命令。
        psalms:
        - number: '118'
          start: '153'
          end: '160'
        - number: '118'
          start: '161'
          end: '168'
        - number: '118'
          start: '169'
          end: '176'
      - type: table_row
        label: Nona Feria
        text: 凡敬畏主的人 * 都有福了。
