  psalmody.reges-tharsis-et-nsul-m-nera-fferent-7146cb932f:
    role: psalmody
    content:
      en-dr:
      - type: versicle
        text: The kings of Tharsis and of the isles shall give presents.
      - type: response
        text: The kings of Arabia and Saba shall bring gifts.
      la:
      - type: versicle
        text: Reges Tharsis et ínsulæ múnera ófferent.
      - type: response
        text: Reges Arabum et Saba dona addúcent.
      en:
      - type: versicle
        text: The kings of Tarshish and the islands shall offer gifts.
      - type: response
        text: The kings of Arabia and Sheba shall bring tribute.
      zhs-ecu:
      - type: versicle
        text: 他施和海岛的王要进贡。
      - type: response
        text: 阿拉伯和示巴的王要献礼物。
      zhs:
      - type: versicle
        text: 塔尔史士和群岛的众王将献上礼品，
      - type: response
        text: 舍巴和色巴的君王，也都要前来进贡。
  psalmody.ror-te-c-li-d-super-et-nubes-pluant-iustum-aperi-fadcdfd709:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          Drop down, ye heavens, from above, * and let the skies pour down the Righteous One: let the earth open and bring forth the Saviour.
          Send forth the Lamb, O Lord, * the Ruler of the land, from the rock of the wilderness unto the mount of the daughter of Zion.
          That thy way, O Lord, * may be known upon earth, thy saving health among all nations.
          O Lord, * reward them that wait for thee, and let thy prophets be found faithful.
          The law was given by Moses, * but grace and truth came by Jesus Christ.
      la:
      - type: text
        text: |-
          Roráte, cæli, désuper, * et nubes pluant iustum: aperiátur terra, et gérminet Salvatórem.
          Emítte Agnum, Dómine, * Dominatórem terræ, de Petra desérti, ad montem fíliæ Sion.
          Ut cognoscámus, Dómine, * in terra viam tuam, in ómnibus géntibus salutáre tuum.
          Da mercédem, Dómine, * sustinéntibus te, ut prophétæ tui fidéles inveniántur.
          Lex per Móysen data est, * grátia et véritas per Iesum Christum facta est.
      en:
      - type: text
        text: |-
          Drop down dew, O heavens, from above, * and let the clouds rain down the Just One: let the earth be opened, and bring forth a Savior.
          Send forth the Lamb, O Lord, * the Ruler of the earth, from the rock of the desert, to the mountain of the daughter of Sion.
          That we may know, O Lord, * your way upon earth, your salvation among all nations.
          Give your reward, O Lord, * to those who wait for you, that your prophets may be found faithful.
          The law was given through Moses, * grace and truth came through Jesus Christ.
      zhs-ecu:
      - type: text
        text: |-
          诸天哪，要如雨倾盆而降， * 云要降下公义；地要裂开，产出救主。
          主啊，求你差遣羔羊， * 那全地的主宰，从旷野的磐石，到锡安女子的山。
          主啊，求你使我们认识 * 你在地上的道，使万民得知你的救恩。
          主啊，求你赏赐 * 那等候你的人，使你的众先知显为忠信。
          律法本是借着摩西颁布的， * 恩典和真理却是由耶稣基督来的。
      zhs:
      - type: text
        text: |-
          诸天，请由上滴下甘露，* 望云彩降下仁义；愿大地裂开，生出救主。
          上主，请从旷野的磐石 * 派遣统治大地的羔羊，至熙雍女儿的山岭。
          上主，使我们认识 * 祢在大地上的道路，万民得知祢的救恩。
          上主，赐给等待祢的人以报偿，* 使祢的先知们被发现是忠实的。
          法律是藉梅瑟传授的，* 恩宠和真理却是由耶稣基督而来的。
  psalmody.rue-a-fr-mea-deus-nimam-meam-244f9b85f7:
    role: psalmody
    content:
      en-dr:
      - type: versicle
        text: Deliver, O God, my soul from the sword.
      - type: response
