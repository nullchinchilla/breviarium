        antiphon: The Lord is just * and has loved justice.
        psalms:
        - number: '10'
      - type: versicle
        text: My eyes have gone before you at dawn.
      - type: response
        text: That I might meditate on your words, O Lord.
      zhs-ecu:
      - type: psalmody
        antiphon: 惟喜爱主律法、 * 昼夜思想他律法的，这人便为有福。
        psalms:
        - number: '1'
