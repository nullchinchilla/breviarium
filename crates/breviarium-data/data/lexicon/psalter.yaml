        - number: '9'
          start: '33'
          end: '39'
      - type: psalmody
        antiphon: 主是公义的， * 他喜爱公义。
        psalms:
        - number: '10'
      - type: versicle
        text: 我的眼睛趁夜更未换将仰望你。
      - type: response
        text: 好叫我默想你的言语，主啊。
      zhs:
      - type: psalmody
        antiphon: 昼夜默思上主法律的人，* 真是有福！
        psalms:
        - number: '1'
      - type: psalmody
        antiphon: 应以敬畏之情事奉上主，* 战战兢兢向他欢呼。
