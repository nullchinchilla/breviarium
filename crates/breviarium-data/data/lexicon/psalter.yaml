        psalms:
        - number: '18'
      - type: psalmody
        antiphon: 马利亚说： * 这是怎样的问安，竟使我的心惊慌？因我将要生下君王，他却不损坏我童贞的封闭。
        psalms:
        - number: '19'
      - type: psalmody
        antiphon: 在至高君王降临之际， * 愿人心得以洁净，使我们配得迎接他：因为看哪，他必来，绝不迟延。
        psalms:
        - number: '20'
      - type: versicle
        text: 主必从他的圣所出来。
      - type: response
        text: 他要来拯救他的子民。
      zhs:
      - type: psalmody
        antiphon: 看，君王要来， * 高举着大能的权柄，为拯救万民。阿肋路亚。
        psalms:
        - number: '1'
        - number: '2'
        - number: '3'
        - number: '6'
      - type: psalmody
        antiphon: 加强 * 痿弱的手：振作起来，说：看，我们的天主要来，祂要拯救我们。阿肋路亚。
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
        - number: '10'
      - type: psalmody
        antiphon: 众人欢乐 * 踊跃喜欢：看，上主要来，报复已到，祂要带来报酬；祂亲自要来，要拯救我们。
        psalms:
        - number: '11'
        - number: '12'
        - number: '13'
        - number: '14'
      - type: versicle
        text: 天主由美丽绝伦的熙雍，发出光明。
      - type: response
        text: 我们的天主来临，绝不会默默无声。
      - type: psalmody
        antiphon: 欢乐踊跃吧 * 耶路撒冷女儿：看，你的君王要来到你这里：熙雍，不要畏惧，因为你的救恩快要来临。
        psalms:
        - number: '15'
      - type: psalmody
        antiphon: 我们的君王 * 基督要来，若翰曾宣告祂是将要来临的羔羊
