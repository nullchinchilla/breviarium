        psalms:
        - number: '64'
      - type: psalmody
        antiphon: In the innocence * of my heart I will walk, O Lord.
        psalms:
        - number: '100'
      - type: psalmody
        antiphon: My heart rejoiced * in the Lord, who humbles and lifts up.
        psalms:
        - number: '223'
      - type: psalmody
        antiphon: Praise * the Lord, O my soul, who raises up the downtrodden and loves the just.
        psalms:
        - number: '145'
