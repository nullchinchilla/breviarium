        psalms:
        - number: '50'
      - type: psalmody
        antiphon: A hymn becomes you, * O God, in Sion.
        psalms:
        - number: '64'
      - type: psalmody
        antiphon: My lips * shall praise you all my life, O my God.
        psalms:
        - number: '62'
        - number: '66'
      - type: psalmody
        antiphon: The Lord will judge * the ends of the earth.
        psalms:
        - number: '223'
      - type: psalmody
        antiphon: Heavens of heavens, * praise God.
        psalms:
        - number: '148'
