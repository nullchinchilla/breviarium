          end: '8'
        - number: '118'
          start: '9'
          end: '16'
        - number: '118'
          start: '17'
          end: '24'
        - number: '118'
          start: '25'
          end: '32'
      - type: table_row
        label: Prima Feria II
        text: 当存敬畏的心事奉主， * 又当战兢而快乐。
        psalms:
        - number: '1'
        - number: '2'
        - number: '6'
      - type: table_row
        label: Prima Feria III
        text: 神是公义的审判者， * 又强壮又恒忍：难道他天天发怒吗？
        psalms:
        - number: '7'
        - number: '8'
        - number: '9'
          start: '2'
          end: '19'
      - type: table_row
        label: Prima Feria IV
        text: 主啊，求你兴起， * 不容人得胜。
        psalms:
        - number: '9'
          start: '20'
          end: '39'
        - number: '10'
        - number: '11'
      - type: table_row
        label: Prima Feria V
        text: 我要向主歌唱， * 因他用厚恩待我。
        psalms:
        - number: '12'
        - number: '13'
        - number: '14'
      - type: table_row
        label: Prima Feria VI
        text: 我的好处 * 与你无益；我倚靠你，主啊，求你保守我。
        psalms:
        - number: '15'
        - number: '16'
        - number: '17'
          start: '2'
          end: '25'
      - type: table_row
        label: Prima Sabbato
        text: 主是永活的， * 拯救我的神是当称颂的。
        psalms:
        - number: '17'
          start: '26'
          end: '51'
        - number: '18'
        - number: '19'
      - type: table_row
        label: Prima Festis
        text: 阿肋路亚， * 阿肋路亚，阿肋路亚（阿肋路亚）
