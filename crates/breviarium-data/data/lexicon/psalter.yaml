  psalmody.allel-ia-allel-ia-allel-ia-8cee0b0a17:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          Alleluia, * Alleluia, Alleluia.
          ;;
          ;;
      - type: versicle
        text: God hath begotten us again unto a lively hope, alleluia.
      - type: response
        text: By the resurrection of Jesus Christ from the dead, alleluia.
      - type: text
        text: |-
          Alleluia, * Alleluia, Alleluia.
          ;;
          ;;
      - type: versicle
        text: God raised up Christ from the dead, alleluia.
      - type: response
        text: That your faith and hope might be in God, alleluia.
      - type: text
        text: |-
          Alleluia, * Alleluia, Alleluia.
          ;;
          ;;
      - type: versicle
        text: God has raised up the Lord, alleluia.
      - type: response
        text: And he will raise us up by his power, alleluia.
      la:
      - type: text
        text: |-
          Allelúia, * Allelúia, Allelúia.
          ;;
          ;;
      - type: versicle
        text: Deus regeneravit nos in spem vivam, allelúia.
      - type: response
        text: Per resurrectiónem Iesu Christi ex mórtuis, allelúia.
      - type: text
        text: |-
          Allelúia, * Allelúia, Allelúia.
          ;;
          ;;
      - type: versicle
        text: Deus suscitávit Christum a mórtuis, allelúia.
      - type: response
        text: Ut fides nostra et spes esset in Deo, allelúia.
      - type: text
        text: |-
          Allelúia, * Allelúia, Allelúia.
          ;;
          ;;
      - type: versicle
        text: Deus et Dóminum suscitávit, allelúia.
      - type: response
        text: Et nos suscitábit per virtútem suam, allelúia.
      en:
      - type: text
        text: |-
          Alleluia, * Alleluia, Alleluia.
          ;;
          ;;
      - type: versicle
        text: God has regenerated us unto a living hope, alleluia.
      - type: response
        text: Through the Resurrection of Jesus Christ from the dead, alleluia.
      - type: text
        text: |-
          Alleluia, * Alleluia, Alleluia.
          ;;
          ;;
      - type: versicle
        text: God has raised Christ from the dead, alleluia.
      - type: response
        text: That our faith and hope might be in God, alleluia.
      - type: text
        text: |-
          Alleluia, * Alleluia, Alleluia.
          ;;
          ;;
      - type: versicle
        text: God has also raised up the Lord, alleluia.
      - type: response
        text: And he will raise us up also by his power, alleluia.
      zhs-ecu:
      - type: text
        text: |-
          阿肋路亚， * 阿肋路亚，阿肋路亚。
          ;;
          ;;
      - type: versicle
        text: 神重生了我们，叫我们有活泼的盼望，阿肋路亚。
      - type: response
        text: 藉着耶稣基督从死里复活，阿肋路亚。
      - type: text
        text: |-
          阿肋路亚， * 阿肋路亚，阿肋路亚。
          ;;
          ;;
      - type: versicle
        text: 神使基督从死里复活，阿肋路亚。
      - type: response
        text: 好叫我们的信心与盼望都在于神，阿肋路亚。
      - type: text
        text: |-
          阿肋路亚， * 阿肋路亚，阿肋路亚。
          ;;
          ;;
      - type: versicle
        text: 神也叫主复活了，阿肋路亚。
      - type: response
        text: 他也要用自己的大能叫我们复活，阿肋路亚。
      zhs:
      - type: text
        text: |-
          阿肋路亚，* 阿肋路亚，阿肋路亚。
          ;;
          ;;
      - type: versicle
        text: 天主以充满生命的希望重生了我们，阿肋路亚。
      - type: response
        text: 藉耶稣基督由死者中的复活，阿肋路亚。
      - type: text
        text: |-
          阿肋路亚，* 阿肋路亚，阿肋路亚。
          ;;
          ;;
      - type: versicle
        text: 天主使基督由死者中复活，阿肋路亚。
      - type: response
        text: 使我们的信德和望德都归于天主，阿肋路亚。
      - type: text
        text: |-
          阿肋路亚，* 阿肋路亚，阿肋路亚。
          ;;
          ;;
      - type: versicle
        text: 天主使主复活了，阿肋路亚。
      - type: response
        text: 祂也要以自己的能力使我们复活，阿肋路亚。
