        psalms:
        - number: '126'
      - type: psalmody
        antiphon: Blessed * are all who fear the Lord.
        psalms:
        - number: '127'
      - type: psalmody
        antiphon: Often * have they fought against me from my youth.
        psalms:
        - number: '128'
      - type: psalmody
        antiphon: Out of the depths * I have cried to you, O Lord.
        psalms:
        - number: '129'
      - type: psalmody
        antiphon: Let Israel hope * in the Lord.
        psalms:
        - number: '130'
      zhs-ecu:
      - type: psalmody
        antiphon: 他在城门口与仇敌说话时 * 必不致蒙羞。
        psalms:
        - number: '126'
      - type: psalmody
        antiphon: 凡敬畏主的人 * 都有福了。
        psalms:
        - number: '127'
      - type: psalmody
        antiphon: 从我幼年以来， * 人屡次苦害我。
        psalms:
        - number: '128'
      - type: psalmody
        antiphon: 主啊，我从深处 * 求告你。
        psalms:
        - number: '129'
      - type: psalmody
        antiphon: 以色列啊， * 你当仰望主。
        psalms:
        - number: '130'
