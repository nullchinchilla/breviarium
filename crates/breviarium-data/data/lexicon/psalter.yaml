  psalmody.ecce-v-niet-d-minus-princeps-regum-terr-be-ti-qu-828df81a42:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          Behold, the Lord cometh, * the Prince of the Kings of the earth: blessed are they that are ready to go forth to meet him.
          When the Son of man cometh, * shall he find faith on the earth?
          Behold, the fulness * of the time is come, when God sent forth his Son into the world.
          With joy * shall ye draw water out of the wells of the Saviour.
          The Lord goeth forth * from his holy place he cometh to save his people.
      la:
      - type: text
        text: |-
          Ecce véniet * Dóminus princeps regum terræ: beáti, qui parati sunt occúrrere illi.
          Cum vénerit * Fílius hóminis, putas invéniet fidem super terram?
          Ecce iam venit * plenitúdo témporis, in quo misit Deus Fílium suum in terras.
          Hauriétis aquas * in gáudio de fóntibus Salvatóris.
          Egrediétur * Dóminus de loco sancto suo: véniet ut salvet pópulum suum.
      en:
      - type: text
        text: |-
          Behold, the Lord * shall come, the prince of the kings of the earth: blessed are those who are prepared to go out to meet him.
          When the Son of Man comes, * do you think he will find faith on earth?
          Behold, now comes * the fullness of time, in which God sent his Son into the lands.
          You shall draw waters * with joy from the fountains of the Savior.
          The Lord shall go forth * from his holy place: he shall come to save his people.
      zhs-ecu:
      - type: text
        text: |-
          看哪，那作地上君王元首的主必来： * 凡预备好迎接他的人,便为有福。
          人子来的时候， * 你想他能在世上找到信德吗？
          看哪，时候已经满足， * 神就在此时差遣他的子降到世间。
          你们必从救主的泉源 * 欢然取水。
          主必从他的圣所出来： * 他要来拯救他的子民。
      zhs:
      - type: text
        text: |-
          看，主——地上君王的统治者——将要来临：* 准备好迎接他的人，真是有福！
          当人子来临时，* 他会在地上找到信德吗？
          看，时机的圆满 * 已经来到，天主在此时遣派了他的圣子来到世间。
          你们将从救主的泉源中 * 欢欣汲水。
          上主将从他的圣所出来，* 他要来拯救他的人民。
