          start: '33'
          end: '40'
        - number: '118'
          start: '41'
          end: '48'
        - number: '118'
          start: '49'
          end: '56'
      - type: table_row
        label: Tertia Feria II
        text: 求祢扶持我， * 使我得蒙拯救，上主。
        psalms:
        - number: '118'
          start: '105'
          end: '112'
        - number: '118'
          start: '113'
          end: '120'
        - number: '118'
          start: '121'
          end: '128'
      - type: table_row
        label: Tertia Feria
        text: 我呼号， * 祂俯允了我。
        psalms:
        - number: '119'
        - number: '120'
        - number: '121'
      - type: table_row
        label: Sexta Dominica
        text: 阿肋路亚，* 阿肋路亚，阿肋路亚（阿肋路亚）
        psalms:
        - number: '118'
          start: '57'
          end: '64'
        - number: '118'
          start: '65'
          end: '72'
        - number: '118'
          start: '73'
          end: '80'
      - type: table_row
        label: Sexta Feria II
        text: 求祢回顾我， * 求祢怜悯我，上主。
        psalms:
        - number: '118'
          start: '129'
          end: '136'
        - number: '118'
          start: '137'
          end: '144'
        - number: '118'
          start: '145'
          end: '152'
      - type: table_row
        label: Sexta Feria
        text: 祢居住 * 在诸天上，求祢怜悯我们。
