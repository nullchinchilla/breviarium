  psalmody.be-tus-vir-qui-in-lege-d-mini-medit-tur-92dd53120d:
    role: psalmody
    content:
      en-dr:
      - type: psalmody
        antiphon: Blessed is the man * who studieth the law of the Lord.
        psalms:
        - number: '1'
      - type: psalmody
