        psalms:
        - number: '118'
          start: '1'
          end: '8'
        - number: '118'
          start: '9'
          end: '16'
        - number: '118'
          start: '17'
          end: '24'
        - number: '118'
          start: '25'
          end: '32'
      - type: table_row
        label: Tertia Dominica
        text: Allelúia, * allelúia, allelúia (allelúia)
        psalms:
        - number: '118'
          start: '33'
          end: '40'
        - number: '118'
          start: '41'
