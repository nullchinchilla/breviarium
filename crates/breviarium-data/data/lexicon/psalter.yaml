          end: '8'
        - number: '118'
          start: '9'
          end: '16'
        - number: '118'
          start: '17'
          end: '24'
        - number: '118'
          start: '25'
          end: '32'
      - type: table_row
        label: Tertia Dominica
        text: 阿肋路亚，* 阿肋路亚，阿肋路亚（阿肋路亚）
        psalms:
