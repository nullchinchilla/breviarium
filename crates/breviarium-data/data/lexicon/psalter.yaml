  psalmody.text-29b419b1ab:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: ;;
      - type: psalmody
        antiphon: O God of majesty * we praise thy glorious name.
        psalms:
        - number: '211'
      - type: psalmody
        antiphon: Give ye glory to him * in your works.
        psalms:
        - number: '212'
      - type: psalmody
        antiphon: O Lord, great art thou * and glorious in thy power.
        psalms:
        - number: '213'
      - type: psalmody
        antiphon: My people * said the Lord, shall be filled with good things.
        psalms:
        - number: '214'
      - type: psalmody
        antiphon: In the Lord * is the justice and the throne of the children of Israel.
        psalms:
        - number: '215'
      - type: psalmody
        antiphon: Show us, O Lord * thy mercy; and grant us thy salvation.
        psalms:
        - number: '216'
          start: '1'
          end: '13'
      la:
      - type: text
        text: ;;
      - type: psalmody
        antiphon: Laudámus nomen tuum * inclitum, Deus noster.
        psalms:
        - number: '211'
      - type: psalmody
        antiphon: Exaltáte * Regem sæculórum in opéribus vestris.
        psalms:
        - number: '212'
      - type: psalmody
        antiphon: Dómine, * magnus es tu et præclárus in virtúte tua.
        psalms:
        - number: '213'
      - type: psalmody
        antiphon: Pópulus meus, * ait Dóminus, bonis meis adimplébitur.
        psalms:
        - number: '214'
      - type: psalmody
        antiphon: In Dómino iustificábitur * et laudábitur omne semen Israël.
        psalms:
        - number: '215'
      - type: psalmody
        antiphon: Osténde nobis, Dómine, * lucem miseratiónum tuárum.
        psalms:
        - number: '216'
          start: '1'
          end: '13'
      en:
      - type: text
        text: ;;
      - type: psalmody
        antiphon: We praise your glorious * name, O our God.
        psalms:
        - number: '211'
      - type: psalmody
        antiphon: Exalt * the King of ages in your works.
        psalms:
        - number: '212'
      - type: psalmody
        antiphon: O Lord, * you are great and glorious in your power.
        psalms:
        - number: '213'
      - type: psalmody
        antiphon: My people, * says the Lord, shall be filled with my good things.
        psalms:
        - number: '214'
      - type: psalmody
        antiphon: In the Lord shall be justified * and praised all the seed of Israel.
        psalms:
        - number: '215'
      - type: psalmody
        antiphon: Show us, O Lord, * the light of your mercies.
        psalms:
        - number: '216'
          start: '1'
          end: '13'
      zhs-ecu:
      - type: text
        text: ;;
      - type: psalmody
        antiphon: 我们的神啊，我们赞美 * 你荣耀的名。
        psalms:
        - number: '211'
      - type: psalmody
        antiphon: 你们要在所行的事上 * 尊崇万世的君王。
        psalms:
        - number: '212'
      - type: psalmody
        antiphon: 主啊， * 你本为大，你的能力极其显赫。
        psalms:
        - number: '213'
      - type: psalmody
        antiphon: 主说： * 我的百姓必因我的恩惠得享饱足。
        psalms:
        - number: '214'
      - type: psalmody
        antiphon: 以色列的后裔都必因主 * 得称为义,并要夸耀。
        psalms:
        - number: '215'
      - type: psalmody
        antiphon: 主啊，求你向我们显出 * 你怜悯的光。
        psalms:
        - number: '216'
          start: '1'
          end: '13'
      zhs:
      - type: text
        text: ;;
      - type: psalmody
        antiphon: 我们称颂祢 * 荣耀的名，我们的天主。
        psalms:
        - number: '211'
      - type: psalmody
        antiphon: 颂扬 * 万古之王于你们的工程中。
        psalms:
        - number: '212'
      - type: psalmody
        antiphon: 上主，* 祢伟大而荣耀，在祢的大能中。
        psalms:
        - number: '213'
      - type: psalmody
        antiphon: 我的人民，* 上主说，将以我的美物得到饱饫。
        psalms:
        - number: '214'
      - type: psalmody
        antiphon: 以色列所有的后裔，* 必要因上主获胜夸耀。
        psalms:
        - number: '215'
      - type: psalmody
        antiphon: 上主，求祢向我们显示 * 祢慈悲的光辉。
        psalms:
        - number: '216'
          start: '1'
          end: '13'
