        antiphon: Serve the Lord * in fear, and rejoice before him with trembling.
        psalms:
        - number: '2'
      - type: psalmody
        antiphon: Arise, * O Lord, save me, O my God.
        psalms:
        - number: '3'
      - type: versicle
        text: In the night I remembered your name, O Lord.
      - type: response
        text: And I have kept your law.
      - type: psalmody
        antiphon: How wonderful * is your name, O Lord, throughout all the earth!
        psalms:
        - number: '8'
      - type: psalmody
        antiphon: You sit upon the throne, * O you who judge with justice.
        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: Arise, O Lord, * let not man prevail.
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: At midnight I arose to give you praise.
      - type: response
        text: Above the judgments of your justice.
      - type: psalmody
        antiphon: Why, O Lord, * have you withdrawn far away?
        psalms:
        - number: '9'
          start: '22'
          end: '32'
      - type: psalmody
        antiphon: Arise, * O Lord God, let your hand be exalted.
        psalms:
        - number: '9'
          start: '33'
          end: '39'
