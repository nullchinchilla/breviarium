        text: Be not silent, O God, * for they have surrounded me with words of hatred.
        psalms:
        - number: '108'
          start: '2'
          end: '13'
        - number: '108'
          start: '14'
          end: '21'
        - number: '108'
          start: '22'
          end: '31'
      zhs-ecu:
      - type: table_row
        label: sunday
        text: 阿肋路亚， * 主啊，求你使你的脸光照你的仆人，阿肋路亚，阿肋路亚。
        psalms:
        - number: '118'
          start: '129'
          end: '144'
        - number: '118'
          start: '145'
          end: '160'
        - number: '118'
          start: '161'
          end: '176'
      - type: table_row
        label: monday
        text: 义人哪，你们应当欢喜， * 心里正直的人哪，你们都当夸耀。
        psalms:
        - number: '31'
        - number: '32'
          start: '1'
          end: '11'
        - number: '32'
          start: '12'
          end: '22'
      - type: table_row
        label: tuesday
        text: 主啊，你拯救了我们， * 我们要永远称谢你的名。
        psalms:
        - number: '43'
          start: '2'
          end: '9'
        - number: '43'
          start: '10'
          end: '20'
        - number: '43'
          start: '21'
          end: '26'
      - type: table_row
        label: wednesday
        text: 我的神啊， * 你的慈爱要迎接我。
        psalms:
        - number: '58'
          start: '2'
          end: '11'
        - number: '58'
          start: '12'
          end: '18'
        - number: '59'
      - type: table_row
        label: thursday
        text: 主啊，我们要求告 * 你的名，要述说你奇妙的作为。
        psalms:
        - number: '74'
        - number: '75'
          start: '2'
          end: '7'
        - number: '75'
          start: '8'
          end: '13'
      - type: table_row
        label: friday
        text: 主啊，慈爱和诚实 * 行在你前面。
        psalms:
        - number: '88'
          start: '2'
          end: '19'
        - number: '88'
          start: '20'
          end: '38'
        - number: '88'
          start: '39'
          end: '53'
      - type: table_row
        label: saturday
        text: 神啊，求你不要静默， * 因为他们用怨恨的话围绕我。
        psalms:
        - number: '108'
          start: '2'
          end: '13'
        - number: '108'
          start: '14'
          end: '21'
        - number: '108'
          start: '22'
          end: '31'
      zhs:
      - type: table_row
        label: sunday
        text: 阿肋路亚，* 上主，求以你的慈容光照你的仆人，阿肋路亚，阿肋路亚。
        psalms:
        - number: '118'
          start: '129'
          end: '144'
        - number: '118'
          start: '145'
          end: '160'
        - number: '118'
          start: '161'
          end: '176'
      - type: table_row
        label: monday
        text: 正义的人们，你们应欢欣喜乐，* 心地正直的人都当自豪歌颂。
        psalms:
        - number: '31'
        - number: '32'
          start: '1'
          end: '11'
        - number: '32'
          start: '12'
          end: '22'
      - type: table_row
        label: tuesday
        text: 你救了我们，* 上主，我们要永远颂扬你的名号。
        psalms:
        - number: '43'
          start: '2'
          end: '9'
        - number: '43'
          start: '10'
          end: '20'
        - number: '43'
          start: '21'
          end: '26'
      - type: table_row
        label: wednesday
        text: 我的天主，* 你的慈爱必先来援助我。
        psalms:
        - number: '58'
          start: '2'
          end: '11'
        - number: '58'
          start: '12'
          end: '18'
        - number: '59'
      - type: table_row
        label: thursday
        text: 我们呼求你的名号，上主，* 传扬你的奇蹟。
        psalms:
        - number: '74'
        - number: '75'
          start: '2'
          end: '7'
        - number: '75'
          start: '8'
          end: '13'
      - type: table_row
        label: friday
        text: 仁爱和忠信 * 在你的前面开路，上主。
        psalms:
        - number: '88'
          start: '2'
          end: '19'
        - number: '88'
          start: '20'
          end: '38'
        - number: '88'
          start: '39'
          end: '53'
      - type: table_row
        label: saturday
        text: 天主，不要缄默，* 因他们以毒恨的言语四面抨击我。
        psalms:
        - number: '108'
          start: '2'
          end: '13'
        - number: '108'
          start: '14'
          end: '21'
        - number: '108'
          start: '22'
          end: '31'
  psalmody.allel-ia-lapis-revol-tus-est-allel-ia-ab-stio-mo-2cc6f046f4:
    role: psalmody
    content:
      en-dr:
      - type: text
        text: |-
          Alleluia * The stone was rolled back, alleluia, from the door of the sepulchre, alleluia, alleluia.;;
          ;;
          ;;
      - type: versicle
        text: The Lord is risen from the sepulcher, alleluia.
      - type: response
        text: He, who hangeth on the tree, alleluia.
      - type: text
        text: |-
          Alleluia, * Alleluia * Whom do you seek, women? alleluia: the living among the dead? Alleluia, alleluia.;;
          ;;
          ;;
      - type: versicle
        text: The Lord is risen indeed, alleluia.
      - type: response
        text: And hath appeared to Simon, alleluia.
      - type: text
        text: |-
          Alleluia * Do not weep, Maria, alleluia: the Lord is risen, alleluia, alleluia.;;
          ;;
          ;;
      - type: response
        text: The disciples therefore were glad, alleluia.
      - type: versicle
        text: When they saw the Lord, alleluia.
      la:
      - type: text
        text: |-
          Allelúia, * lapis revolútus est, allelúia: ab óstio monuménti, allelúia, allelúia.;;
          ;;
          ;;
      - type: versicle
        text: Surréxit Dóminus de sepúlcro, allelúia.
      - type: response
        text: Qui pro nobis pepéndit in ligno, allelúia.
      - type: text
        text: |-
          Allelúia, * quem quæris, múlier? allelúia: vivéntem cum mórtuis? Allelúia, allelúia.;;
          ;;
          ;;
      - type: versicle
        text: Surréxit Dóminus vere, allelúia.
      - type: response
        text: Et appáruit Simóni, allelúia.
      - type: text
        text: |-
          Allelúia, * noli flere María, allelúia: resurréxit Dóminus, allelúia, allelúia.;;
          ;;
          ;;
      - type: versicle
        text: Gavísi sunt discípuli, allelúia.
      - type: response
        text: Viso Dómino, allelúia.
      en:
      - type: text
        text: |-
          Alleluia, * the stone has been rolled away, alleluia: from the door of the tomb, alleluia, alleluia.;;
          ;;
          ;;
      - type: versicle
        text: The Lord has risen from the tomb, alleluia.
      - type: response
        text: Who for us hung upon the wood, alleluia.
      - type: text
        text: |-
          Alleluia, * whom do you seek, O woman? alleluia: the living one among the dead? Alleluia, alleluia.;;
          ;;
          ;;
      - type: versicle
        text: The Lord is truly risen, alleluia.
      - type: response
        text: And he appeared to Simon, alleluia.
      - type: text
        text: |-
          Alleluia, * weep not, Mary, alleluia: the Lord is risen, alleluia, alleluia.;;
          ;;
          ;;
      - type: versicle
        text: The disciples rejoiced, alleluia.
      - type: response
        text: Having seen the Lord, alleluia.
      zhs-ecu:
      - type: text
        text: |-
          阿肋路亚， * 石头已经辊开了，阿肋路亚：从坟墓门口，阿肋路亚，阿肋路亚。;;
          ;;
          ;;
      - type: versicle
        text: 主从坟墓中复活了，阿肋路亚。
      - type: response
        text: 就是那为我们悬挂在木头上的主，阿肋路亚。
      - type: text
        text: |-
          阿肋路亚， * 妇人，你找谁呢？阿肋路亚：为何在死人中找活人？阿肋路亚，阿肋路亚。;;
          ;;
          ;;
      - type: versicle
        text: 主真的复活了，阿肋路亚。
      - type: response
        text: 他向西门显现了，阿肋路亚。
      - type: text
        text: |-
          阿肋路亚， * 马利亚，不要哭，阿肋路亚：主复活了，阿肋路亚，阿肋路亚。;;
          ;;
          ;;
      - type: versicle
        text: 门徒看见了主， * 就喜乐了，阿肋路亚。
      - type: response
        text: 看见了主，阿肋路亚。
      zhs:
      - type: text
        text: |-
          阿肋路亚，* 石头已被滚开，阿肋路亚：从墓门前，阿肋路亚，阿肋路亚。;;
          ;;
          ;;
      - type: versicle
        text: 上主从坟墓中复活了，阿肋路亚。
      - type: response
        text: 祂为我们被钉在十字架上，阿肋路亚。
      - type: text
        text: |-
          阿肋路亚，* 妇人，你寻找谁？阿肋路亚：要在死者中寻找活人吗？阿肋路亚，阿肋路亚。;;
          ;;
          ;;
      - type: versicle
        text: 主确实复活了，阿肋路亚。
      - type: response
        text: 祂显现给西满，阿肋路亚。
      - type: text
        text: |-
          阿肋路亚，* 玛利亚，不要哭泣，阿肋路亚：主已复活，阿肋路亚，阿肋路亚。;;
          ;;
          ;;
      - type: versicle
        text: 门徒们喜乐了，阿肋路亚。
      - type: response
        text: 因看见了上主，阿肋路亚。
