        - number: '126'
      - type: psalmody
        antiphon: Beáti * omnes, qui timent Dóminum.
        psalms:
        - number: '127'
      - type: psalmody
        antiphon: Sæpe * expugnavérunt me a iuventúte mea.
        psalms:
        - number: '128'
      - type: psalmody
        antiphon: De profúndis * clamávi ad te Dómine.
        psalms:
        - number: '129'
      - type: psalmody
        antiphon: Speret * Israël in Dómino.
        psalms:
        - number: '130'
