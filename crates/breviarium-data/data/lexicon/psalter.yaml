        text: 主啊，我夜间记念你的名。
      - type: response
        text: 我也遵守了你的律法。
      - type: psalmody
        antiphon: 主啊，你的名 * 在全地何其美！
        psalms:
        - number: '8'
      - type: psalmody
        antiphon: 你坐在宝座上， * 按公义施行审判。
        psalms:
        - number: '9'
          start: '2'
          end: '11'
      - type: psalmody
        antiphon: 主啊，求你兴起， * 不容人得胜。
        psalms:
        - number: '9'
          start: '12'
          end: '21'
      - type: versicle
        text: 我半夜起来称谢你。
