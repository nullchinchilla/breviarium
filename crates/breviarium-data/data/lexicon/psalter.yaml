        - number: '50'
      - type: psalmody
        antiphon: 神啊，在锡安 * 有赞美等候你。
        psalms:
        - number: '64'
      - type: psalmody
        antiphon: 我的神啊，我这一生 * 都要用嘴唇赞美你。
        psalms:
        - number: '62'
        - number: '66'
      - type: psalmody
        antiphon: 主必审判 * 地极。
        psalms:
        - number: '223'
      - type: psalmody
        antiphon: 天上的天哪， * 你们都要赞美神。
        psalms:
        - number: '148'
        - number: '149'
        - number: '150'
      zhs:
      - type: psalmody
        antiphon: 求你把我的过犯洗尽，* 上主，求你把我的罪恶除净。
        psalms:
        - number: '50'
      - type: psalmody
        antiphon: 天主，人应在熙雍山上 * 歌咏赞美你。
        psalms:
        - number: '64'
      - type: psalmody
        antiphon: 我的灵魂 * 好似饱享了膏脂，我要以欢愉的口唇赞美祢，我的天主。
        psalms:
        - number: '62'
        - number: '66'
      - type: psalmody
        antiphon: 上主要裁判地极，* 高举受傅者的冠冕。
        psalms:
        - number: '223'
      - type: psalmody
        antiphon: 天上的诸天，* 请赞美天主！
        psalms:
        - number: '148'
        - number: '149'
        - number: '150'
  psalmody.mplius-lava-me-d-mine-ab-iniust-tia-mea-ee26f02973:
    role: psalmody
