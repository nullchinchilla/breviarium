        psalms:
        - number: '145'
  psalmody.ne-perdas-cum-mpiis-deus-nimam-meam-066e38dbc1:
    role: psalmody
    content:
      en-dr:
      - type: versicle
        text: Take not away my soul, O God, with the wicked.
      - type: response
        text: Nor my life with bloody men.
      la:
      - type: versicle
        text: Ne perdas cum ímpiis, Deus, ánimam meam.
      - type: response
        text: Et cum viris sánguinum vitam meam.
      en:
      - type: versicle
        text: Destroy not with the ungodly, O God, my soul.
      - type: response
        text: Nor my life with men of blood.
      zhs-ecu:
      - type: versicle
        text: 神啊，不要把我的性命和罪人一同除掉。
      - type: response
        text: 不要把我的生命和好流人血的一同除掉。
      zhs:
      - type: versicle
        text: 求祢不要把我的灵魂和罪人们一起收去，天主。
      - type: response
        text: 求祢不要把我的生命，与流血者一起铲除。
  psalmody.non-confund-tur-cum-loqu-tur-inim-cis-suis-in-po-c1da643366:
    role: psalmody
    content:
      en-dr:
      - type: psalmody
        antiphon: He shall not be confounded * when he speaks to his enemies in the gate.
        psalms:
        - number: '126'
      - type: psalmody
        antiphon: Blessed are all they * that fear the Lord.
        psalms:
        - number: '127'
      - type: psalmody
        antiphon: Often * have they fought against me from my youth.
        psalms:
        - number: '128'
      - type: psalmody
        antiphon: Out of the depths * I have cried to thee, O Lord.
        psalms:
        - number: '129'
      - type: psalmody
